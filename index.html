        if (mistakesLabel) mistakesLabel.textContent = `MISTAKES · ${shoppingGame.mistakes} / 3`;
        if (shoppingGame.mistakes >= 3) {
          const messages = shoppingGame.event.gameOver;
          showGameOver(shoppingGame.event, messages[Math.floor(Math.random() * messages.length)]);
          return;
        }
        if (status) status.textContent = `Wrong product: ${name}. Check the label carefully.`;
        return;
      }
      if (shoppingGame.collected.has(name)) return;
      shoppingGame.collected.add(name);
      if (shoppingGame.collected.size === round.items.length) {
        shoppingGame.round += 1;
        if (shoppingGame.round >= SHOPPING_ROUNDS.length) {
          completeEvent();
          return;
        }
        shoppingGame.aisle = 0;
        shoppingGame.collected = new Set();
      }
      renderShoppingStage();
    }

    function cleanupShopping() {
      if (shoppingInterval) window.clearInterval(shoppingInterval);
      shoppingInterval = 0;
      shoppingGame = null;
    }

    function prepareDrive(event) {
      cleanupDrive();
      const canvas = document.getElementById("drive-canvas");
      driveGame = {
        event,
        canvas,
        context: canvas.getContext("2d"),
        elapsed: 0,
        startedAt: 0,
        lastTime: 0,
        spawnIn: 1.5,
        playerLane: 0,
        obstacles: [],
        active: false
      };
      drawDrive();
      document.getElementById("drive-start").addEventListener("click", startDrive);
      app.querySelectorAll("[data-drive-key]").forEach((button) => {
        const key = `drive-${button.dataset.driveKey}`;
        button.addEventListener("pointerdown", (pointerEvent) => {
          pointerEvent.preventDefault();
          button.setPointerCapture(pointerEvent.pointerId);
          heldKeys.add(key);
        });
        const release = () => heldKeys.delete(key);
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      });
    }

    function startDrive() {
      if (!driveGame || driveGame.active) return;
      driveGame.active = true;
      driveGame.startedAt = performance.now();
      driveGame.lastTime = driveGame.startedAt;
      document.getElementById("drive-start").disabled = true;
      driveFrame = requestAnimationFrame(updateDrive);
    }

    function spawnDriveObstacle() {
      const lane = Math.floor(Math.random() * 3) - 1;
      driveGame.obstacles.push({
        lane,
        depth: 0.03,
        icon: ["🚧", "🪵", "🛞", "🦌"][Math.floor(Math.random() * 4)]
      });
    }

    function updateDrive(timestamp) {
      if (!driveGame || !driveGame.active) return;
      const delta = Math.min((timestamp - driveGame.lastTime) / 1000, 0.05);
      driveGame.lastTime = timestamp;
      driveGame.elapsed = (timestamp - driveGame.startedAt) / 1000;
      if (driveGame.elapsed >= driveGame.event.duration) {
        completeEvent();
        return;
      }
      const steering = Number(heldKeys.has("drive-right") || heldKeys.has("d") || heldKeys.has("arrowright")) -
        Number(heldKeys.has("drive-left") || heldKeys.has("a") || heldKeys.has("arrowleft"));
      const curve = Math.sin(driveGame.elapsed * (0.28 + driveGame.elapsed / driveGame.event.duration * 0.2));
      const drift = curve * (0.1 + driveGame.elapsed / driveGame.event.duration * 0.3);
      driveGame.playerLane = Math.max(-1, Math.min(1, driveGame.playerLane + (steering * (0.92 + driveGame.elapsed * 0.012) - drift) * delta));
      driveGame.spawnIn -= delta;
      if (driveGame.spawnIn <= 0) {
        spawnDriveObstacle();
        driveGame.spawnIn = Math.max(0.66, 1.5 - driveGame.elapsed * 0.017);
      }
      const obstacleSpeed = 0.39 + driveGame.elapsed * 0.006;
      for (let index = driveGame.obstacles.length - 1; index >= 0; index--) {
        const obstacle = driveGame.obstacles[index];
        obstacle.depth += obstacleSpeed * delta;
        if (obstacle.depth >= 0.92) {
          if (Math.abs(driveGame.playerLane - obstacle.lane) < 0.43) {
            showGameOver(driveGame.event);
            return;
          }
          driveGame.obstacles.splice(index, 1);
        }
      }
      drawDrive();
      const time = document.getElementById("drive-time");
      const condition = document.getElementById("drive-condition");
      const status = document.getElementById("drive-status");
      if (time) time.textContent = `${Math.max(0, driveGame.event.duration - driveGame.elapsed).toFixed(1)}s`;
      if (condition) condition.textContent = driveGame.elapsed >= 12 ? "NIGHT DRIVE · HEAVY RAIN" : "NIGHT DRIVE · DRY";
      if (status) {
        const turn = Math.sin(driveGame.elapsed * 0.43);
        status.textContent = driveGame.elapsed < 12
          ? "Steer with ← / → or A / D. The road is calm for now."
          : turn > 0.2 ? "A sharp right bend! Rain is reducing visibility." : turn < -0.2 ? "A sharp left bend! Rain is reducing visibility." : "Rain is falling. Keep watching the road.";
      }
      driveFrame = requestAnimationFrame(updateDrive);
    }

    function drawDrive() {
      if (!driveGame) return;
      const { context: ctx, canvas, elapsed } = driveGame;
      const width = canvas.width;
      const height = canvas.height;
      const horizon = 82;
      const centerAt = (depth) => width / 2 +
        Math.sin(elapsed * 0.43 + depth * 1.6) * depth * 112 +
        Math.sin(elapsed * 0.19) * depth * 32;
      const roadWidthAt = (depth) => 38 + depth * 340;
      ctx.clearRect(0, 0, width, height);
      const sky = ctx.createLinearGradient(0, 0, 0, horizon);
      sky.addColorStop(0, "#070a18");
      sky.addColorStop(1, "#283451");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, horizon);
      ctx.fillStyle = "#d9e7ff";
      for (let index = 0; index < 36; index++) {
        const x = (index * 191 + 57) % width;
        const y = (index * 43 + 17) % (horizon - 10);
        ctx.globalAlpha = 0.35 + (index % 4) * 0.14;
        ctx.fillRect(x, y, 2, 2);
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#17233a";
      ctx.fillRect(0, horizon, width, height - horizon);
      ctx.beginPath();
      for (let step = 0; step <= 20; step++) {
        const depth = step / 20;
        const y = horizon + depth * (height - horizon);
        const x = centerAt(depth) - roadWidthAt(depth);
        if (step === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      for (let step = 20; step >= 0; step--) {
        const depth = step / 20;
        const y = horizon + depth * (height - horizon);
        ctx.lineTo(centerAt(depth) + roadWidthAt(depth), y);
      }
      ctx.closePath();
      ctx.fillStyle = "#30333d";
      ctx.fill();
      ctx.strokeStyle = "#d9d4b8";
      ctx.lineWidth = 3;
      for (const edge of [-1, 1]) {
        ctx.beginPath();
        for (let step = 0; step <= 20; step++) {
          const depth = step / 20;
          const x = centerAt(depth) + edge * roadWidthAt(depth);
          const y = horizon + depth * (height - horizon);
          if (step === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      for (const laneDivider of [-1 / 3, 1 / 3]) {
        for (let marker = 0; marker < 9; marker++) {
          const depth = ((marker / 9 + elapsed * 0.38) % 1);
          const y = horizon + depth * (height - horizon);
          const x = centerAt(depth) + laneDivider * roadWidthAt(depth);
          const size = 1 + depth * 4;
          ctx.fillStyle = "#e8dcae";
          ctx.fillRect(x - size / 2, y, size, 15 * depth + 2);
        }
      }
      for (const obstacle of driveGame.obstacles) {
        const depth = Math.min(1, obstacle.depth);
        const x = centerAt(depth) + obstacle.lane * roadWidthAt(depth) * 0.56;
        const y = horizon + depth * (height - horizon);
        ctx.font = `${18 + depth * 44}px system-ui`;
        ctx.textAlign = "center";
        ctx.fillText(obstacle.icon, x, y);
      }
      const carX = centerAt(1) + driveGame.playerLane * roadWidthAt(1) * 0.56;
      ctx.save();
      ctx.translate(carX, height - 23);
      ctx.fillStyle = "#0b111c";
      ctx.beginPath();
      ctx.moveTo(-44, 23); ctx.lineTo(-34, -22); ctx.lineTo(-21, -37);
      ctx.lineTo(21, -37); ctx.lineTo(34, -22); ctx.lineTo(44, 23);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#557ba8";
      ctx.beginPath();
      ctx.moveTo(-27, -21); ctx.lineTo(-17, -33); ctx.lineTo(17, -33); ctx.lineTo(27, -21);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffedb2";
      ctx.fillRect(-34, 12, 12, 5); ctx.fillRect(22, 12, 12, 5);
      ctx.restore();
      if (elapsed >= 12) {
        const intensity = Math.min(0.44, 0.08 + (elapsed - 12) / driveGame.event.duration * 0.42);
        ctx.fillStyle = `rgba(15, 23, 40, ${intensity})`;
        ctx.fillRect(0, horizon, width, height - horizon);
        ctx.strokeStyle = `rgba(197, 220, 255, ${Math.min(0.6, intensity + 0.12)})`;
        ctx.lineWidth = 1;
        for (let drop = 0; drop < 75; drop++) {
          const x = (drop * 137 + elapsed * 190) % width;
          const y = (drop * 61 + elapsed * 320) % height;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 5, y + 13); ctx.stroke();
        }
      }
      if (!driveGame.active) {
        ctx.fillStyle = "#07101dcc";
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "#eff3ff";
        ctx.textAlign = "center";
        ctx.font = "800 27px system-ui, sans-serif";
        ctx.fillText("READY TO DRIVE", width / 2, height / 2);
      }
    }

    function cleanupDrive() {
      if (driveFrame) cancelAnimationFrame(driveFrame);
      driveFrame = 0;
      driveGame = null;
      heldKeys.clear();
    }

    function prepareRunner(event) {
      cleanupRunner();
      const canvas = document.getElementById("runner-canvas");
      const world = createThreeRunner(canvas, event);
      if (!world) {
        const note = document.getElementById("runner-engine-note");
        note.textContent = "Three.js or WebGL is unavailable; using the built-in perspective fallback.";
        note.hidden = false;
      }
      runner = {
        event,
        canvas,
        context: world ? null : canvas.getContext("2d"),
        world,
        lane: 1,
        targetLane: 1,
        elapsed: 0,
        lastTime: 0,
        spawnIn: 1.4,
        jump: 0,
        slide: 0,
        obstacles: [],
        pointerStart: null,
        active: false
      };
      drawRunner();
      document.getElementById("runner-start").addEventListener("click", startRunner);
      canvas.addEventListener("pointerdown", (pointerEvent) => {
        if (runner) runner.pointerStart = { x: pointerEvent.clientX, y: pointerEvent.clientY };
      });
      canvas.addEventListener("pointerup", (pointerEvent) => {
        if (!runner || !runner.pointerStart) return;
        const dx = pointerEvent.clientX - runner.pointerStart.x;
        const dy = pointerEvent.clientY - runner.pointerStart.y;
        runner.pointerStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
        if (Math.abs(dx) > Math.abs(dy)) moveRunner(dx < 0 ? "left" : "right");
        else moveRunner(dy < 0 ? "jump" : "slide");
      });
      app.querySelectorAll("[data-runner-action]").forEach((button) => {
        button.addEventListener("click", () => moveRunner(button.dataset.runnerAction));
      });
    }

    function startRunner() {
      if (!runner) return;
      runner.active = true;
      runner.lastTime = performance.now();
      document.getElementById("runner-start").disabled = true;
      runnerFrame = requestAnimationFrame(updateRunner);
    }

    function moveRunner(action) {
      if (!runner || !runner.active) return;
      if (action === "left") runner.targetLane = Math.max(0, runner.targetLane - 1);
      else if (action === "right") runner.targetLane = Math.min(2, runner.targetLane + 1);
      else if (action === "jump" && runner.jump <= 0.05) runner.jump = 0.75;
      else if (action === "slide" && runner.slide <= 0.05) runner.slide = 0.8;
    }

    function spawnRunnerObstacle() {
      const roll = Math.random();
      const kind = runner.event.environment === "night"
        ? roll < 0.5 ? "train" : roll < 0.76 ? "overhead" : "barrier"
        : roll < 0.38 ? "train" : roll < 0.7 ? "barrier" : "overhead";
      const lane = Math.floor(Math.random() * 3);
      const mesh = runner.world ? createRunnerObstacleMesh(kind, runner.event.environment) : null;
      if (mesh) runner.world.scene.add(mesh);
      runner.obstacles.push({ kind, lane, z: 1, passed: false, mesh });
    }

    function updateRunner(timestamp) {
      if (!runner || !runner.active) return;
      const delta = Math.min((timestamp - runner.lastTime) / 1000, 0.05);
      runner.lastTime = timestamp;
      runner.elapsed += delta;
      const remaining = runner.event.duration - runner.elapsed;
      if (remaining <= 0) {
        completeEvent();
        return;
      }
      runner.lane += (runner.targetLane - runner.lane) * Math.min(1, delta * 11);
      runner.jump = Math.max(0, runner.jump - delta);
      runner.slide = Math.max(0, runner.slide - delta);

      runner.spawnIn -= delta;
      if (runner.spawnIn <= 0) {
        spawnRunnerObstacle();
        const difficulty = runner.event.difficulty;
        runner.spawnIn = Math.max(0.9, (1.55 - runner.elapsed * 0.008) / difficulty);
      }

      const speed = (0.32 + runner.elapsed * 0.002) * runner.event.difficulty;
      for (let index = runner.obstacles.length - 1; index >= 0; index--) {
        const obstacle = runner.obstacles[index];
        obstacle.z -= speed * delta;
        if (obstacle.mesh) {
          obstacle.mesh.position.x = (obstacle.lane - 1) * 2.35;
          obstacle.mesh.position.z = -45 + (1 - obstacle.z) * 45;
        }
        if (!obstacle.passed && obstacle.z <= 0.105) {
          obstacle.passed = true;
          const sameLane = Math.abs(runner.lane - obstacle.lane) < 0.42;
          const jumping = runner.jump > 0.12;
          const sliding = runner.slide > 0.12;
          const collision = sameLane && (
            obstacle.kind === "train" ||
            obstacle.kind === "barrier" && !jumping ||
            obstacle.kind === "overhead" && !sliding
          );
          if (collision) {
            showGameOver(runner.event);
            return;
          }
        }
        if (obstacle.z < -0.08) {
          if (obstacle.mesh) {
            runner.world.scene.remove(obstacle.mesh);
            disposeThreeObject(obstacle.mesh);
          }
          runner.obstacles.splice(index, 1);
        }
      }
      updateThreeRunner(delta);
      drawRunner();
      const timeLabel = document.getElementById("runner-time");
      const laneLabel = document.getElementById("runner-distance");
      if (timeLabel) timeLabel.textContent = `${Math.max(0, remaining).toFixed(1)} seconds`;
      if (laneLabel) laneLabel.textContent = `LANE ${Math.round(runner.lane) + 1} · ${runner.event.environment === "night" ? "NIGHT RUN" : "DAY RUN"}`;
      runnerFrame = requestAnimationFrame(updateRunner);
    }

    function drawRunner() {
      if (!runner) return;
      if (runner.world) {
        runner.world.renderer.render(runner.world.scene, runner.world.camera);
        return;
      }
      const { context: ctx, event } = runner;
      const width = runner.canvas.width;
      const height = runner.canvas.height;
      const horizon = 104;
      const center = width / 2;
      ctx.clearRect(0, 0, width, height);

      const sky = ctx.createLinearGradient(0, 0, 0, horizon);
      if (event.environment === "night") {
        sky.addColorStop(0, "#111b43");
        sky.addColorStop(1, "#59446e");
      } else {
        sky.addColorStop(0, "#60c9f1");
        sky.addColorStop(1, "#d4f4ff");
      }
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, horizon);
      ctx.fillStyle = event.environment === "night" ? "#f8e9ba" : "#fff3ad";
      ctx.beginPath();
      ctx.arc(event.environment === "night" ? 675 : 675, event.environment === "night" ? 40 : 47, 21, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = event.environment === "night" ? "#202a44" : "#4b9d77";
      ctx.fillRect(0, horizon, width, height - horizon);
      for (let side = 0; side < 2; side++) {
        for (let building = 0; building < 8; building++) {
          const x = side === 0 ? building * 35 : width - building * 37 - 28;
          const buildingHeight = 28 + (building * 19) % 70;
          ctx.fillStyle = event.environment === "night" ? (building % 2 ? "#25304f" : "#2e3658") : (building % 2 ? "#79b795" : "#6aa684");
          ctx.fillRect(x, horizon - buildingHeight + 10, 28, buildingHeight);
          if (event.environment === "night" && building % 2 === 0) {
            ctx.fillStyle = "#ffdd8a";
            ctx.fillRect(x + 7, horizon - buildingHeight + 22, 4, 6);
            ctx.fillRect(x + 17, horizon - buildingHeight + 36, 4, 6);
          }
        }
      }

      const roadNear = 335;
      ctx.beginPath();
      ctx.moveTo(center - 33, horizon);
      ctx.lineTo(center + 33, horizon);
      ctx.lineTo(center + roadNear, height);
      ctx.lineTo(center - roadNear, height);
      ctx.closePath();
      ctx.fillStyle = event.environment === "night" ? "#343545" : "#525664";
      ctx.fill();

      const project = (z, lane) => {
        const depth = 1 - z;
        const y = horizon + depth * (height - horizon);
        const laneOffset = (lane - 1) * (27 + depth * 190);
        return { x: center + laneOffset, y, scale: 0.12 + depth * 1.08 };
      };
      ctx.strokeStyle = event.environment === "night" ? "#9aa6c9" : "#d9d4bd";
      ctx.lineWidth = 3;
      for (let laneEdge = -1; laneEdge <= 1; laneEdge++) {
        const nearX = center + laneEdge * roadNear;
        const farX = center + laneEdge * 33;
        ctx.beginPath(); ctx.moveTo(farX, horizon); ctx.lineTo(nearX, height); ctx.stroke();
      }
      ctx.strokeStyle = event.environment === "night" ? "#adb5d1" : "#e5e0cd";
      ctx.lineWidth = 4;
      for (const track of [-0.66, 0, 0.66]) {
        const nearX = center + track * roadNear;
        const farX = center + track * 33;
        ctx.beginPath(); ctx.moveTo(farX - 7, horizon); ctx.lineTo(nearX - 7, height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(farX + 7, horizon); ctx.lineTo(nearX + 7, height); ctx.stroke();
      }
      const phase = (runner.elapsed * 0.8) % 1;
      for (let tie = 0; tie < 14; tie++) {
        const z = 1 - ((tie / 14 + phase) % 1);
        const point = project(z, 1);
        const spread = 38 + (1 - z) * 265;
        ctx.strokeStyle = event.environment === "night" ? "#6a5360" : "#927450";
        ctx.lineWidth = Math.max(1, point.scale * 3);
        ctx.beginPath(); ctx.moveTo(center - spread, point.y); ctx.lineTo(center + spread, point.y); ctx.stroke();
      }

      for (const obstacle of runner.obstacles) drawRunnerObstacle(ctx, obstacle, project);
      const playerY = height - 33 - (runner.jump > 0 ? Math.sin((0.75 - runner.jump) / 0.75 * Math.PI) * 88 : 0);
      const playerX = center + (runner.lane - 1) * 190;
      drawRunnerPlayer(ctx, playerX, playerY, runner.slide > 0);
      if (!runner.active) {
        ctx.fillStyle = "#10142bdd";
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "800 27px system-ui, sans-serif";
        ctx.fillText(event.environment === "night" ? "NIGHT RUN" : "DAY SHIFT EXPRESS", center, 200);
        ctx.font = "600 15px system-ui, sans-serif";
        ctx.fillText("Three lanes · Watch the rails", center, 230);
      }
    }

    function drawRunnerObstacle(ctx, obstacle, project) {
      if (obstacle.z > 1 || obstacle.z < -0.02) return;
      const point = project(obstacle.z, obstacle.lane);
      const size = point.scale;
      if (obstacle.kind === "train") {
        const trainW = 48 * size;
        const trainH = 100 * size;
        const gradient = ctx.createLinearGradient(point.x - trainW / 2, 0, point.x + trainW / 2, 0);
        gradient.addColorStop(0, runner.event.environment === "night" ? "#38416d" : "#526b8b");
        gradient.addColorStop(.5, runner.event.environment === "night" ? "#7478a6" : "#9ab2c8");
        gradient.addColorStop(1, runner.event.environment === "night" ? "#30395f" : "#475d7a");
        ctx.fillStyle = gradient;
        ctx.fillRect(point.x - trainW / 2, point.y - trainH, trainW, trainH);
        ctx.fillStyle = runner.event.environment === "night" ? "#f5cc8c" : "#b8efff";
        ctx.fillRect(point.x - trainW * .31, point.y - trainH * .8, trainW * .24, trainH * .2);
        ctx.fillRect(point.x + trainW * .07, point.y - trainH * .8, trainW * .24, trainH * .2);
        ctx.fillStyle = "#ffdf80";
        ctx.fillRect(point.x - trainW * .32, point.y - trainH * .13, trainW * .64, Math.max(2, 4 * size));
      } else if (obstacle.kind === "barrier") {
        const obstacleW = 52 * size;
        const obstacleH = 36 * size;
        ctx.fillStyle = "#e86548";
        ctx.fillRect(point.x - obstacleW / 2, point.y - obstacleH, obstacleW, obstacleH);
        ctx.fillStyle = "#ffd589";
        ctx.fillRect(point.x - obstacleW / 2, point.y - obstacleH * .6, obstacleW, obstacleH * .22);
        ctx.fillStyle = "#654636";
        ctx.fillRect(point.x - obstacleW * .4, point.y - 5 * size, 6 * size, 8 * size);
        ctx.fillRect(point.x + obstacleW * .3, point.y - 5 * size, 6 * size, 8 * size);
      } else {
        const beamW = 59 * size;
        ctx.fillStyle = "#cf5f71";
        ctx.fillRect(point.x - beamW / 2, point.y - 67 * size, beamW, 12 * size);
        ctx.fillStyle = "#f6b6a2";
        ctx.fillRect(point.x - beamW / 2, point.y - 67 * size, 6 * size, 12 * size);
        ctx.fillRect(point.x + beamW / 2 - 6 * size, point.y - 67 * size, 6 * size, 12 * size);
      }
    }

    function drawRunnerPlayer(ctx, x, y, sliding) {
      ctx.save();
      ctx.translate(x, y);
      if (sliding) ctx.rotate(-0.2);
      ctx.fillStyle = "#11142b55";
      ctx.beginPath(); ctx.ellipse(0, 0, 24, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f2c5a5";
      ctx.beginPath(); ctx.arc(0, sliding ? -15 : -47, 13, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#d94e64";
      ctx.fillRect(-15, sliding ? -19 : -36, 30, sliding ? 13 : 30);
      ctx.fillStyle = "#212a49";
      ctx.fillRect(-14, sliding ? -7 : -7, 11, 8);
      ctx.fillRect(3, sliding ? -7 : -7, 11, 8);
      ctx.restore();
    }

    function cleanupRunner() {
      if (runnerFrame) cancelAnimationFrame(runnerFrame);
      runnerFrame = 0;
      if (runner && runner.world) {
        window.removeEventListener("resize", runner.world.resize);
        runner.world.renderer.dispose();
        disposeThreeObject(runner.world.scene);
      }
      runner = null;
    }

    function createThreeRunner(canvas, event) {
      if (!window.THREE) return null;
      const THREE = window.THREE;
      const context = canvas.getContext("webgl2") || canvas.getContext("webgl");
      if (!context) return null;
      const renderer = new THREE.WebGLRenderer({ canvas, context, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const scene = new THREE.Scene();
      const night = event.environment === "night";
      scene.background = new THREE.Color(night ? "#111934" : "#8ddfff");
      scene.fog = new THREE.Fog(night ? "#262941" : "#b5dce7", 38, 105);
      const camera = new THREE.PerspectiveCamera(57, 800 / 450, 0.1, 130);
      camera.position.set(0, 5.2, 9.5);
      camera.lookAt(0, 1.15, -16);
      scene.add(new THREE.HemisphereLight(night ? "#95a9ff" : "#e7faff", night ? "#22243c" : "#71855f", night ? 1.05 : 1.25));
      const sun = new THREE.DirectionalLight(night ? "#a4b8ff" : "#fff3d4", night ? 1.1 : 1.6);
      sun.position.set(-5, 12, 8);
      sun.castShadow = true;
      scene.add(sun);

      const material = (color, roughness = 0.82, metalness = 0) => new THREE.MeshStandardMaterial({ color, roughness, metalness });
      const ground = new THREE.Mesh(new THREE.BoxGeometry(10.5, 0.25, 115), material(night ? "#343748" : "#555960"));
      ground.position.set(0, -0.18, -43);
      ground.receiveShadow = true;
      scene.add(ground);
      const sleeperMaterial = material(night ? "#625354" : "#8f7353");
      const railMaterial = material(night ? "#abb3d0" : "#c8d2d7", 0.34, 0.72);
      const sleepers = [];
      for (let index = 0; index < 31; index++) {
        const sleeper = new THREE.Mesh(new THREE.BoxGeometry(8.7, 0.13, 0.32), sleeperMaterial);
        sleeper.position.set(0, -0.015, 8 - index * 2.8);
        sleeper.receiveShadow = true;
        scene.add(sleeper);
        sleepers.push(sleeper);
      }
      for (let lane = 0; lane < 3; lane++) {
        const centerX = (lane - 1) * 2.35;
        for (const offset of [-0.72, 0.72]) {
          const rail = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.2, 115), railMaterial);
          rail.position.set(centerX + offset, 0.04, -43);
          rail.castShadow = true;
          scene.add(rail);
        }
      }

      const scenery = [];
      for (let side = -1; side <= 1; side += 2) {
        for (let index = 0; index < 12; index++) {
          const z = 5 - index * 8;
          const x = side * (7.2 + (index % 3) * 1.1);
          const group = new THREE.Group();
          const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.2, 1.2, 6), material(night ? "#393247" : "#71553a"));
          trunk.position.y = 0.6;
          trunk.castShadow = true;
          group.add(trunk);
          const crown = new THREE.Mesh(new THREE.ConeGeometry(1.05, 2.5, 7), material(night ? "#303b5b" : index % 2 ? "#4c9a70" : "#60a97a"));
          crown.position.y = 2.15;
          crown.castShadow = true;
          group.add(crown);
          if (night && index % 3 === 0) {
            const lamp = new THREE.PointLight("#ffd58b", 1.7, 12);
            lamp.position.set(-side * 1.1, 3.2, 0);
            group.add(lamp);
          }
          group.position.set(x, 0, z);
          scene.add(group);
          scenery.push(group);
        }
      }

      const player = new THREE.Group();
      const shirt = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.82, 0.42), material("#dc5366"));
      shirt.position.y = 1.18;
      shirt.castShadow = true;
      player.add(shirt);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 12), material("#f1c5a5"));
      head.position.y = 1.88;
      head.castShadow = true;
      player.add(head);
      const legs = [];
      for (const side of [-1, 1]) {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.65, 0.27), material("#27314e"));
        leg.position.set(side * 0.18, 0.47, 0);
        leg.castShadow = true;
        player.add(leg);
        legs.push(leg);
        const arm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.64, 0.2), material("#f1c5a5"));
        arm.position.set(side * 0.43, 1.18, 0);
        arm.rotation.z = side * -0.18;
        player.add(arm);
      }
      player.position.set(0, 0, 0);
      scene.add(player);

      const resize = () => {
        if (runner && runner.world?.renderer !== renderer) return;
        const width = Math.max(1, canvas.clientWidth);
        const height = Math.max(1, canvas.clientHeight);
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      };
      resize();
      window.addEventListener("resize", resize);
      return { renderer, scene, camera, player, legs, sleepers, scenery, resize };
    }

    function createRunnerObstacleMesh(kind, environment) {
      const THREE = window.THREE;
      const group = new THREE.Group();
      const night = environment === "night";
      const material = (color, metalness = 0) => new THREE.MeshStandardMaterial({ color, roughness: 0.72, metalness });
      const box = (width, height, depth, color, y) => {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material(color, kind === "train" ? 0.24 : 0));
        mesh.position.y = y;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);
        return mesh;
      };
      if (kind === "train") {
        if (night) {
          box(2.05, 3.35, 4.2, "#343a5c", 1.68);
          box(1.65, 0.6, 0.09, "#929de0", 2.55).position.z = 2.15;
          box(1.6, 0.16, 0.16, "#c276b3", 3.42);
          for (const side of [-0.62, 0.62]) box(0.25, 0.2, 0.1, "#ffe49a", 0.52).position.set(side, 0.52, 2.17);
          box(0.8, 0.12, 0.1, "#a9bcff", 0.2).position.z = 2.18;
        } else {
          box(1.85, 3.55, 4.5, "#678ca3", 1.78);
          box(1.48, 0.8, 0.08, "#b7edff", 2.75).position.z = 2.29;
          box(0.66, 0.18, 0.09, "#ffd78a", 0.45).position.z = 2.3;
        }
      } else if (kind === "barrier") {
        box(1.8, 0.72, 0.48, "#e96748", 0.54);
        box(1.84, 0.16, 0.5, "#ffe098", 0.6).position.z = 0.02;
        for (const side of [-0.65, 0.65]) box(0.14, 0.48, 0.15, "#584638", 0.22).position.x = side;
      } else {
        box(2.1, 0.26, 0.32, night ? "#df758f" : "#d86370", 2.65);
        for (const side of [-0.92, 0.92]) box(0.15, 2.45, 0.2, "#7b6073", 1.25).position.x = side;
      }
      return group;
    }

    function updateThreeRunner(delta) {
      if (!runner || !runner.world) return;
      const world = runner.world;
      const speed = 11 * runner.event.difficulty;
      for (const sleeper of world.sleepers) {
        sleeper.position.z += speed * delta;
        if (sleeper.position.z > 10) sleeper.position.z -= 86.8;
      }
      for (const prop of world.scenery) {
        prop.position.z += speed * delta * 0.72;
        if (prop.position.z > 9) prop.position.z -= 96;
      }
      world.player.position.x += ((runner.targetLane - 1) * 2.35 - world.player.position.x) * Math.min(1, delta * 11);
      const jumpPhase = runner.jump > 0 ? (0.75 - runner.jump) / 0.75 : 0;
      world.player.position.y = runner.jump > 0 ? Math.sin(jumpPhase * Math.PI) * 1.45 : 0;
      world.player.scale.y = runner.slide > 0 ? 0.48 : 1;
      world.legs.forEach((leg, index) => {
        leg.rotation.x = runner.slide > 0 ? 0.1 : Math.sin(runner.elapsed * 15 + index * Math.PI) * 0.38;
      });
    }

    function disposeThreeObject(root) {
      if (!root || !root.traverse) return;
      root.traverse((object) => {
        if (object.geometry) object.geometry.dispose();
        if (object.material) {
          for (const material of Array.isArray(object.material) ? object.material : [object.material]) material.dispose();
        }
      });
    }


    function prepareMultitask(event) {
      renderComputerPanel();

      document.getElementById("phone-button").addEventListener("click", () => {
        if (!multi || multi.ended) return;
        multi.phoneDeadline = performance.now() + 10000;
        updateMultiClocks();
      });
      app.querySelectorAll("[data-answer]").forEach((button) => {
        button.addEventListener("click", () => {
          answerQuiz(Number(button.dataset.answer));
        });
      });
      app.querySelectorAll("[data-woman-answer]").forEach((button) => {
        button.addEventListener("click", () => triggerWomanEscape(button.dataset.womanAnswer));
      });
      multiInterval = window.setInterval(tickMultitask, 50);
      updateMultiClocks();
    }

    function answerComputer(selected) {
      if (!multi || multi.ended || multi.computerDone) return;
      if (multi.currentProblem.choices[selected] !== multi.currentProblem.solution) {
        showGameOver(multi.event, multi.event.gameOver.computer);
        return;
      }
      multi.computerSolved += 1;
      multi.computerDone = multi.computerSolved >= multi.event.computerGoal;
      if (!multi.computerDone) multi.currentProblem = chooseComputerProblem(multi.event);
      renderComputerPanel();
      checkMultitaskComplete();
    }

    function tickMultitask() {
      if (!multi || multi.ended) return;
      const now = performance.now();
      const mainRemaining = 60 - (now - multi.startedAt) / 1000;
      if (mainRemaining <= 0) {
        showGameOver(multi.event, multi.event.gameOver.timeout);
        return;
      }

      if (now >= multi.phoneDeadline) {
        showGameOver(multi.event, multi.event.gameOver.phone);
        return;
      }

      if (multi.quizIndex < multi.event.questions.length && now >= multi.quizDeadline) {
        if (multi.quizAnswered === null) {
          showGameOver(multi.event, multi.event.gameOver.quiz);
          return;
        }
        multi.quizIndex += 1;
        multi.quizAnswered = null;
        if (multi.quizIndex < multi.event.questions.length) {
          multi.quizDeadline = now + 10000;
          const panel = document.getElementById("quiz-panel");
          if (panel) {
            panel.innerHTML = `
              <div class="challenge-head"><h3>C. Multiple-choice quiz</h3><span class="challenge-clock" id="quiz-clock">10s</span></div>
              <p class="quiz-progress">Question ${multi.quizIndex + 1} of ${multi.event.questions.length}</p>
              <p class="quiz-question">${multi.event.questions[multi.quizIndex].question}</p>
              <div class="quiz-options">${multi.event.questions[multi.quizIndex].answers.map((answer, index) => `<button class="quiz-option" type="button" data-answer="${index}">${String.fromCharCode(65 + index)}. ${answer}</button>`).join("")}</div>
              <p class="quiz-state">Choose carefully. The next question waits for this timer.</p>`;
            panel.querySelectorAll("[data-answer]").forEach((button) => {
              button.addEventListener("click", () => answerQuiz(Number(button.dataset.answer)));
            });
          }
        } else {
          const panel = document.getElementById("quiz-panel");
          if (panel) panel.innerHTML = '<div class="challenge-head"><h3>C. Multiple-choice quiz</h3><span class="challenge-clock">DONE</span></div><p class="quiz-progress">All six questions answered. The microwave grudgingly respects you.</p>';
        }
      }

      if (!multi.womanTriggered && mainRemaining <= 30) {
        multi.womanTriggered = true;
        const overlay = document.getElementById("woman-overlay");
        if (overlay) overlay.hidden = false;
      }
      updateMultiClocks();
      checkMultitaskComplete();
    }

    function answerQuiz(selected) {
      if (!multi || multi.quizAnswered !== null || multi.quizIndex >= multi.event.questions.length) return;
      if (selected !== multi.event.questions[multi.quizIndex].correct) {
        showGameOver(multi.event, multi.event.gameOver.quiz);
        return;
      }
      if (multi.quizIndex === multi.event.questions.length - 1) {
        multi.quizIndex += 1;
        const panel = document.getElementById("quiz-panel");
        if (panel) panel.innerHTML = '<div class="challenge-head"><h3>C. Multiple-choice quiz</h3><span class="challenge-clock">DONE</span></div><p class="quiz-progress">All six questions answered. The microwave grudgingly respects you.</p>';
        checkMultitaskComplete();
        return;
      }
      multi.quizAnswered = selected;
      app.querySelectorAll("[data-answer]").forEach((option) => { option.disabled = true; });
      const status = document.getElementById("quiz-state");
      if (status) status.textContent = "Correct. Hold on until the full ten-second round ends...";
      app.querySelector(`[data-answer="${selected}"]`)?.classList.add("selected-correct");
    }

    function updateMultiClocks() {
      if (!multi || multi.ended) return;
      const now = performance.now();
      const mainRemaining = Math.max(0, 60 - (now - multi.startedAt) / 1000);
      const mainClock = document.getElementById("main-clock");
      const phoneClock = document.getElementById("phone-clock");
      const quizClock = document.getElementById("quiz-clock");
      if (mainClock) mainClock.textContent = `${Math.ceil(mainRemaining)}s`;
      if (phoneClock) phoneClock.textContent = Math.max(0, (multi.phoneDeadline - now) / 1000).toFixed(1);
      if (quizClock && multi.quizIndex < multi.event.questions.length) {
        quizClock.textContent = `${Math.max(0, (multi.quizDeadline - now) / 1000).toFixed(1)}s`;
      }
    }

    function triggerWomanEscape(answer) {
      if (!multi || multi.womanDone) return;
      const attempt = multi;
      const dialogue = document.getElementById("woman-dialogue");
      const scene = document.getElementById("woman-scene");
      const sprite = document.getElementById("woman-sprite");
      const options = document.getElementById("woman-options");
      if (dialogue) dialogue.textContent = `Red: "${answer}"`;
      if (options) options.innerHTML = '<p class="event-copy">Woman: "AAAAAAAAAAAAAAAAAAAAAA!"</p>';
      if (scene) scene.classList.add("screaming");
      attempt.womanTimers.push(window.setTimeout(() => {
        if (multi !== attempt || attempt.ended) return;
        if (sprite) sprite.classList.add("running");
      }, 450));
      attempt.womanTimers.push(window.setTimeout(() => {
        if (multi !== attempt || attempt.ended) return;
        const overlay = document.getElementById("woman-overlay");
        if (overlay) overlay.hidden = true;
        attempt.womanDone = true;
        checkMultitaskComplete();
      }, 2400));
    }

    function checkMultitaskComplete() {
      if (!multi || multi.ended) return;
      const quizDone = multi.quizIndex >= multi.event.questions.length;
      if (multi.computerDone && quizDone && multi.womanDone) {
        multi.ended = true;
        window.clearInterval(multiInterval);
        multiInterval = 0;
        completeEvent();
      }
    }

    function startWait(event) {
      const started = performance.now();
      waitInterval = window.setInterval(() => {
        const remaining = Math.max(0, 10 - (performance.now() - started) / 1000);
        const count = document.getElementById("wait-count");
        if (count) count.textContent = remaining.toFixed(1);
        if (remaining <= 0) {
          window.clearInterval(waitInterval);
          waitInterval = 0;
          const message = document.getElementById("wait-message");
          if (message) message.textContent = "He came the second you had to go.........";
          waitTimeout = window.setTimeout(completeEvent, 2000);
        }
      }, 50);
    }

    function cleanupMultitask() {
      if (multiInterval) window.clearInterval(multiInterval);
      if (multi) multi.womanTimers.forEach((timer) => window.clearTimeout(timer));
      if (waitInterval) window.clearInterval(waitInterval);
      if (waitTimeout) window.clearTimeout(waitTimeout);
      multiInterval = 0;
      waitInterval = 0;
      waitTimeout = 0;
      multi = null;
    }

    function cleanupBoss() {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      if (boss && boss.endTimer) window.clearTimeout(boss.endTimer);
      if (boss && boss.audio) boss.audio.close();
      animationFrame = 0;
      heldKeys.clear();
      boss = null;
    }

    function cleanupMinigames() {
      cleanupBoss();
      cleanupRunner();
      cleanupMultitask();
      cleanupMaze();
      cleanupDistraction();
      cleanupRhythm();
      cleanupShooter();
      cleanupShopping();
      cleanupDrive();
    }

    function completeEvent() {
      cleanupMinigames();
      eventIndex += 1;
      saveProgress();
      if (eventIndex >= character.events.length) screen = "complete";
      else screen = "event";
      render();
    }

    function showGameOver(event, message) {
      cleanupMinigames();
      screen = "gameover";
      screenEvent = { ...event, gameOver: message || event.gameOver };
      render();
    }

    let screenEvent = null;
    function renderGameOver() {
      app.innerHTML = `
        <section class="panel journey">
          <div class="progress-track" aria-hidden="true"><div class="progress-fill" style="width:${(eventIndex / character.events.length) * 100}%"></div></div>
          <section class="event-card game-over" style="margin-top:22px">
            <div class="event-emoji" aria-hidden="true">✕</div>
            <h1>GAME OVER</h1>
            <p class="event-copy">${screenEvent.gameOver}</p>
            <div class="button-row">
              <button class="button pink" id="retry-button" type="button">Retry this event</button>
              <button class="button" id="gameover-menu" type="button">Return to main menu</button>
            </div>
          </section>
        </section>`;
      document.getElementById("retry-button").addEventListener("click", () => {
        screen = "event";
        render();
      });
      document.getElementById("gameover-menu").addEventListener("click", goToMenu);
    }

    function renderComplete() {
      const nightmareSummary = selectedCharacterId === "weekend-blue"
        ? `<p class="nightmare-hit-summary" id="nightmare-hit-summary">Nightmare Battle hits received: <strong>${nightmareHits}</strong></p>`
        : "";
      app.innerHTML = `
        <section class="panel complete-card">
          <div class="complete-star" aria-hidden="true">🌙</div>
          <span class="eyebrow">DAY COMPLETE</span>
          <h1>${character.name}'s life is complete!</h1>
          <p>${character.name} made it through all ${character.events.length} events. The day is over; the consequences are tomorrow's problem.</p>
          ${nightmareSummary}
          <button class="button primary event-action" id="complete-menu" type="button">Return to main menu</button>
        </section>`;
      document.getElementById("complete-menu").addEventListener("click", goToMenu);
    }

    function goToMenu() {
      saveProgress();
      cleanupMinigames();
      screen = "menu";
      render();
    }

    menuButton.addEventListener("click", goToMenu);
    document.addEventListener("keydown", (keyboardEvent) => {
      const key = keyboardEvent.key.toLowerCase();
      if (screen !== "event" || keyboardEvent.target.matches("input, textarea")) return;
      if (rhythmGame && rhythmGame.active) {
        const lanes = { arrowleft: 0, arrowdown: 1, arrowup: 2, arrowright: 3 };
        if (Object.prototype.hasOwnProperty.call(lanes, key)) {
          keyboardEvent.preventDefault();
          if (!keyboardEvent.repeat) hitRhythmLane(lanes[key]);
        }
        return;
      }
      if (mazeGame && mazeGame.active) {
        if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"].includes(key)) {
          keyboardEvent.preventDefault();
          heldKeys.add(key);
        }
        return;
      }
      if (shooterGame && shooterGame.active) {
        if (key === " " && !keyboardEvent.repeat) {
          keyboardEvent.preventDefault();
          shootAtCenter();
        } else if (key === "r" && !keyboardEvent.repeat) {
          keyboardEvent.preventDefault();
          reloadShooter();
        } else if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"].includes(key)) {
          keyboardEvent.preventDefault();
          heldKeys.add(key);
        }
        return;
      }
      if (driveGame && driveGame.active) {
        if (["arrowleft", "arrowright", "a", "d"].includes(key)) {
          keyboardEvent.preventDefault();
          heldKeys.add(key);
        }
        return;
      }
      if (runner && runner.active) {
        const actions = {
          a: "left", arrowleft: "left", d: "right", arrowright: "right",
          w: "jump", arrowup: "jump", s: "slide", arrowdown: "slide"
        };
        if (actions[key]) {
          keyboardEvent.preventDefault();
          moveRunner(actions[key]);
        }
        return;
      }
      if (!boss || !boss.active) return;
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"].includes(key)) {
        keyboardEvent.preventDefault();
        heldKeys.add(key);
      }
    });
    document.addEventListener("keyup", (keyboardEvent) => heldKeys.delete(keyboardEvent.key.toLowerCase()));
    window.addEventListener("blur", () => {
      heldKeys.clear();
      if (distractionGame) {
        distractionGame.writing = false;
        const button = document.getElementById("writing-button");
        if (button) {
          button.classList.remove("writing");
          button.setAttribute("aria-pressed", "false");
        }
      }
    });
    render();
  </script>
</body>
</html>
