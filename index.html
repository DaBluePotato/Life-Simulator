<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11142b">
  <title>Life Simulator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f7f5ff;
      background: #11142b;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #171a36;
      --muted: #b6b9d1;
      --panel: #202447;
      --line: #ffffff20;
      --blue: #70dcff;
      --pink: #ff83c4;
      --yellow: #ffe17c;
      --green: #83f0bd;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px 22px;
      background:
        radial-gradient(ellipse at 12% 8%, #273b72 0, transparent 35%),
        radial-gradient(ellipse at 88% 85%, #612e69 0, transparent 33%),
        #11142b;
    }

    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 3px;
    }

    .shell { width: min(100%, 980px); margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 24px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid #ffffff35;
      border-radius: 15px;
      background: linear-gradient(145deg, #72e0ff, #7484ff);
      color: #1b2045;
      font-size: 24px;
      box-shadow: 0 8px 26px #4e90ff33;
    }
    .brand-name { font-size: 15px; font-weight: 850; letter-spacing: -.025em; }
    .brand-tag { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .menu-button, .button {
      min-height: 46px;
      padding: 0 20px;
      border: 1px solid #ffffff2a;
      border-radius: 14px;
      background: #ffffff12;
      cursor: pointer;
      font-weight: 750;
      transition: transform 140ms ease, filter 140ms ease, background 140ms ease;
    }
    .menu-button:hover, .button:hover { filter: brightness(1.12); transform: translateY(-2px); }
    .button.primary {
      border-color: #9beaff;
      background: linear-gradient(135deg, #8ae8ff, #8d9eff);
      color: #151a3a;
      box-shadow: 0 8px 22px #73d6ff2b;
    }
    .button.pink {
      border-color: #ffb1d7;
      background: linear-gradient(135deg, #ffa1ce, #ff7daa);
      color: #321530;
    }
    .button:disabled { opacity: .46; cursor: not-allowed; transform: none; }

    .panel {
      border: 1px solid var(--line);
      border-radius: 25px;
      background: linear-gradient(145deg, #252a50f5, #1d2142f5);
      box-shadow: 0 18px 60px #06081955, inset 0 1px #ffffff0b;
    }
    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(26px, 6vw, 58px);
      text-align: center;
    }
    .hero::before, .hero::after {
      position: absolute;
      width: 190px;
      height: 190px;
      border: 1px solid #8bdfff22;
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }
    .hero::before { top: -105px; left: -70px; }
    .hero::after { right: -85px; bottom: -125px; width: 260px; height: 260px; }
    .hero > * { position: relative; z-index: 1; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1px solid #ffffff20;
      border-radius: 999px;
      background: #ffffff0c;
      color: #c4c9f0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin: 0; }
    .hero h1 { margin-top: 19px; font-size: clamp(35px, 8vw, 64px); letter-spacing: -.065em; line-height: 1; }
    .hero-copy { max-width: 570px; margin: 16px auto 0; color: var(--muted); font-size: clamp(15px, 2.7vw, 18px); line-height: 1.65; }
    .hero-card {
      display: grid;
      width: min(100%, 590px);
      grid-template-columns: 76px 1fr auto;
      align-items: center;
      gap: 16px;
      margin: 30px auto 24px;
      padding: 16px;
      border: 1px solid #ffffff20;
      border-radius: 19px;
      background: #10142b80;
      text-align: left;
    }
    .blue-avatar {
      display: grid;
      width: 70px;
      height: 70px;
      place-items: center;
      border-radius: 22px;
      background: linear-gradient(145deg, #7be8ff, #6483f4);
      color: #172044;
      font-size: 38px;
      box-shadow: 0 7px 20px #68b7ff33;
    }
    .hero-card h2 { font-size: 18px; }
    .hero-card p { margin-top: 5px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .difficulty {
      padding: 7px 10px;
      border: 1px solid #91f0c84d;
      border-radius: 999px;
      background: #79e7b81a;
      color: #a4ffda;
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }
    .event-dots { display: flex; justify-content: center; gap: 8px; margin: 0 0 26px; }
    .event-dots span { width: 9px; height: 9px; border-radius: 50%; background: #ffffff24; }
    .event-dots span:nth-child(2n) { background: #88dfff80; }
    .fine-print { margin-top: 15px; color: #9298ba; font-size: 12px; }

    .journey { padding: clamp(20px, 4vw, 34px); }
    .journey-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }
    .journey-head h1 { font-size: clamp(25px, 5vw, 38px); letter-spacing: -.05em; }
    .journey-head p { margin-top: 7px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .step-pill {
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 1px solid #8bdfff44;
      border-radius: 999px;
      background: #65d8ff14;
      color: #a6ebff;
      font-size: 12px;
      font-weight: 800;
    }
    .progress-track { height: 8px; overflow: hidden; border-radius: 99px; background: #ffffff13; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #7de6ff, #ff8fc5); transition: width 350ms ease; }
    .event-content { margin-top: 23px; }
    .event-card {
      padding: clamp(19px, 4vw, 30px);
      border: 1px solid #ffffff1b;
      border-radius: 20px;
      background: #11152f8a;
      text-align: center;
      animation: arrive 300ms ease both;
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .event-emoji { font-size: 48px; line-height: 1; }
    .event-card h2 { margin-top: 13px; font-size: clamp(23px, 5vw, 32px); letter-spacing: -.04em; }
    .event-copy { max-width: 590px; margin: 10px auto 0; color: var(--muted); font-size: 15px; line-height: 1.65; }
    .event-action { margin-top: 22px; }
    .aside-note { margin-top: 16px; color: #939abf; font-size: 12px; }

    .typing-input {
      display: block;
      width: min(100%, 470px);
      min-height: 54px;
      margin: 20px auto 0;
      padding: 0 16px;
      border: 1px solid #ffffff35;
      border-radius: 13px;
      background: #0c1027;
      color: #fff;
      font-size: 17px;
    }
    .typing-target {
      display: inline-block;
      margin-top: 19px;
      padding: 10px 15px;
      border: 1px solid #8bdfff3b;
      border-radius: 12px;
      background: #74ddff12;
      color: #b8f1ff;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: .015em;
    }

    .arena-wrap { width: min(100%, 720px); margin: 22px auto 0; }
    .arena {
      display: block;
      width: 100%;
      height: auto;
      overflow: hidden;
      border: 2px solid #b5c8ff;
      border-radius: 15px;
      background: #11162f;
      box-shadow: 0 0 0 5px #9bb7ff13, 0 12px 30px #03061555;
      touch-action: none;
    }
    .arena-status { display: flex; justify-content: space-between; gap: 12px; margin: 11px 1px 0; color: #d7d9f1; font-size: 13px; font-weight: 750; }
    .arena-status span:last-child { color: #a4eaff; }
    .arena-controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 16px auto 0; }
    .dpad { display: grid; grid-template-columns: repeat(3, 43px); grid-template-rows: repeat(2, 39px); gap: 5px; }
    .dpad button {
      border: 1px solid #ffffff2b;
      border-radius: 10px;
      background: #ffffff14;
      color: #e6ecff;
      cursor: pointer;
      font-size: 17px;
      font-weight: 800;
      touch-action: none;
      user-select: none;
    }
    .dpad button:active { background: #6edbff55; }
    .dpad [data-key="up"] { grid-column: 2; grid-row: 1; }
    .dpad [data-key="left"] { grid-column: 1; grid-row: 2; }
    .dpad [data-key="down"] { grid-column: 2; grid-row: 2; }
    .dpad [data-key="right"] { grid-column: 3; grid-row: 2; }
    .control-tip { max-width: 235px; color: var(--muted); font-size: 12px; line-height: 1.5; text-align: left; }
    .battle-start { margin-top: 15px; }
    #skip-fight { display: block; margin: 12px auto 0; }

    .chest-grid {
      display: grid;
      width: min(100%, 590px);
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(8px, 2vw, 14px);
      margin: 23px auto 0;
    }
    .chest {
      display: grid;
      min-height: clamp(57px, 12vw, 82px);
      place-items: center;
      position: relative;
      overflow: hidden;
      border: 1px solid #ffdc7655;
      border-radius: 15px;
      background: linear-gradient(145deg, #503a5b, #342849);
      cursor: pointer;
      transition: transform 150ms ease, background 200ms ease, border-color 200ms ease;
    }
    .chest:hover { transform: translateY(-3px) rotate(-2deg); }
    .chest-art { position: relative; display: block; width: 37px; height: 31px; transition: transform 220ms ease; }
    .chest-lid {
      position: absolute;
      z-index: 1;
      top: 0;
      left: 1px;
      width: 35px;
      height: 12px;
      border: 2px solid #8b4e23;
      border-radius: 8px 8px 2px 2px;
      background: linear-gradient(#ffd76d, #f8a63e);
    }
    .chest-body {
      position: absolute;
      bottom: 0;
      left: 3px;
      width: 31px;
      height: 21px;
      border: 2px solid #8b4e23;
      border-radius: 2px 2px 7px 7px;
      background: linear-gradient(90deg, #e58b39, #ffc44f 50%, #db7832);
      box-shadow: inset 0 -4px #a84f29;
    }
    .chest-lock {
      position: absolute;
      z-index: 2;
      top: 12px;
      left: 15px;
      width: 8px;
      height: 10px;
      border: 2px solid #fff0a8;
      border-radius: 3px;
      background: #c7772f;
    }
    .chest.opened {
      border-color: #9fffd3a6;
      background: linear-gradient(145deg, #20594e, #27384e);
      animation: chestPop 260ms ease both;
    }
    .chest.opened .chest-art { transform: translateY(-5px) rotate(-8deg); }
    .chest.opened .chest-lid { transform: translateY(-7px) rotate(-18deg); transform-origin: left bottom; }
    .chest.opened .chest-body { filter: brightness(1.14); }
    @keyframes chestPop { 50% { transform: scale(1.12); } }
    .chest-sparkle { color: #baffd9; font-size: 24px; }
    .chest-count { margin-top: 18px; color: #f8e6a3; font-weight: 800; }

    .game-over { border-color: #ff829755; background: linear-gradient(145deg, #3b2347, #24203e); }
    .game-over .event-emoji { color: #ff83a6; }
    .game-over h1 { margin-top: 8px; color: #ff9db3; font-size: clamp(35px, 8vw, 53px); letter-spacing: .04em; }
    .game-over .event-copy { color: #f2d6e5; }
    .button-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 11px; margin-top: 23px; }
    .complete-card {
      padding: clamp(28px, 7vw, 58px);
      border-color: #8dffd14a;
      background: radial-gradient(ellipse at 50% 0, #42796d55, transparent 55%), linear-gradient(145deg, #222b4d, #1d2541);
      text-align: center;
    }
    .complete-star { font-size: 64px; animation: float 2.2s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-8px) rotate(5deg); } }
    .complete-card h1 { margin-top: 12px; font-size: clamp(31px, 7vw, 51px); letter-spacing: -.055em; }
    .complete-card p { max-width: 540px; margin: 13px auto 0; color: var(--muted); line-height: 1.7; }
    .complete-card .nightmare-hit-summary { color: #c6ddff; font-size: 16px; font-weight: 800; }
    .nightmare-hit-summary strong { color: #ffe17c; }
    .footer-note { margin-top: 18px; color: #878eaf; font-size: 11px; text-align: center; }

    .character-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 28px; }
    .character-choice {
      display: flex;
      min-height: 180px;
      flex-direction: column;
      align-items: flex-start;
      padding: 20px;
      border: 1px solid #ffffff20;
      border-radius: 20px;
      background: #10142b80;
      text-align: left;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }
    .character-choice:hover { transform: translateY(-3px); border-color: #9deaff99; background: #20284d; }
    .character-choice.red-choice:hover { border-color: #ff858599; }
    .character-choice.weekend-choice:hover { border-color: #83baff99; }
    .character-choice-top { display: flex; width: 100%; align-items: center; gap: 13px; }
    .character-choice .blue-avatar, .character-choice .red-avatar { flex: 0 0 auto; }
    .red-avatar {
      display: grid;
      width: 60px;
      height: 60px;
      place-items: center;
      border-radius: 19px;
      background: linear-gradient(145deg, #ff907f, #d54565);
      color: #351327;
      font-size: 31px;
      box-shadow: 0 7px 20px #ff5e7d33;
    }
    .character-choice h2 { font-size: 21px; }
    .character-choice p { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .character-choice .difficulty { margin-top: 14px; }
    .character-choice .difficulty.hard { border-color: #ff9a9a55; background: #ff71801c; color: #ffb1ab; }
    .character-choice .difficulty.weekend-difficulty { border-color: #83baff55; background: #64a7ff1c; color: #b9d8ff; }

    .red-theme .journey-head h1, .red-theme .event-card h2 { color: #ffaaa5; }
    .red-theme .step-pill { border-color: #ff868644; background: #ff6e6518; color: #ffc1b7; }
    .red-theme .progress-fill { background: linear-gradient(90deg, #ff9b83, #ffcf78); }
    .red-theme .arena { border-color: #ff9a98; }
    .red-theme .arena-status span:last-child { color: #ffc1b7; }

    .character-choice.fan-choice:hover { border-color: #d29aff99; }
    .character-choice .fan-avatar {
      display: grid;
      width: 60px;
      height: 60px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 19px;
      background: linear-gradient(145deg, #e0a4ff, #8956d9);
      color: #241238;
      font-size: 32px;
      box-shadow: 0 7px 20px #b667ff33;
    }
    .character-choice .difficulty.fan-difficulty { border-color: #d29aff55; background: #ba79ff1c; color: #e2c2ff; }
    .fan-theme .journey-head h1, .fan-theme .event-card h2 { color: #d9b2ff; }
    .fan-theme .step-pill { border-color: #d29aff55; background: #ba79ff1c; color: #e2c2ff; }
    .fan-theme .progress-fill { background: linear-gradient(90deg, #c18aff, #788bff); }
    .weekend-theme .journey-head h1, .weekend-theme .event-card h2 { color: #acd0ff; }
    .weekend-theme .step-pill { border-color: #83baff55; background: #64a7ff1c; color: #c6ddff; }
    .weekend-theme .progress-fill { background: linear-gradient(90deg, #64b6ff, #738aff); }
    .weekend-theme .arena { border-color: #83baff; }
    .weekend-minigame { border-color: #83baff3c; }
    .weekend-theme .arena-status span:last-child { color: #c6ddff; }
    .fan-minigame { border-color: #c18aff3c; }
    .fan-hud, .distraction-hud, .rhythm-hud, .shooter-hud {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      margin: 16px auto 10px;
      color: #e4d3ff;
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .fan-hud #maze-clock { color: #e8c1ff; font-size: 23px; letter-spacing: .06em; }
    .fan-canvas {
      display: block;
      width: min(100%, 800px);
      height: auto;
      margin: 0 auto;
      border: 2px solid #ba8aea88;
      border-radius: 14px;
      background: #100d20;
      box-shadow: 0 12px 30px #08041588;
      touch-action: none;
    }
    .maze-frame, .shooter-frame { position: relative; width: min(100%, 800px); margin: 0 auto; }
    .maze-frame { overflow: hidden; border-radius: 14px; }
    .maze-frame.day-maze { background: #2b1648; box-shadow: 0 0 26px #b35cff25; }
    .maze-frame.night-maze { background: #080d28; box-shadow: 0 0 34px #536dff38; }
    .maze-frame.night-maze .fan-canvas { border-color: #7780e8; }
    .fan-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 12px auto 0; }
    .fan-controls button {
      min-width: 46px;
      min-height: 43px;
      padding: 5px 12px;
      border: 1px solid #c18aff55;
      border-radius: 12px;
      background: #9c62d529;
      color: #f0ddff;
      cursor: pointer;
      font-size: 18px;
      font-weight: 850;
      touch-action: none;
      user-select: none;
    }
    .fan-controls button:active { background: #bd82ff66; }
    .fan-tip { max-width: 720px; margin: 10px auto 0; color: #aaa5c5; font-size: 12px; line-height: 1.5; }
    .distraction-hud { max-width: 760px; padding: 10px 13px; border: 1px solid #ffffff1b; border-radius: 12px; background: #10152b; }
    .distraction-hud strong { color: #ffe083; font-size: 16px; }
    .book-stage { position: relative; width: min(100%, 760px); margin: 0 auto; }
    .book-page {
      min-height: 300px;
      padding: clamp(18px, 4vw, 35px);
      border: 1px solid #f3e5b7;
      border-radius: 9px;
      background: linear-gradient(135deg, #fff8df, #f3e8c5);
      box-shadow: 0 9px 23px #0005;
      color: #3e3346;
      text-align: left;
    }
    .book-heading { display: flex; justify-content: space-between; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid #9a7a7a44; color: #867383; font-family: "Courier New", monospace; font-size: 10px; font-weight: 800; }
    .book-page h3 { margin-top: 20px; color: #45304c; font-family: Georgia, serif; font-size: clamp(20px, 4vw, 26px); }
    .book-copy, .book-words { margin-top: 12px; color: #514454; font-family: Georgia, serif; font-size: 15px; line-height: 1.8; }
    .book-words { display: inline; }
    .book-caret { display: inline-block; width: 7px; height: 17px; margin-left: 3px; vertical-align: -3px; background: #8557a1; animation: caretBlink 800ms steps(2, start) infinite; }
    @keyframes caretBlink { to { visibility: hidden; } }
    .distraction-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .distraction-popup {
      position: absolute;
      z-index: 2;
      display: grid;
      max-width: min(230px, 70%);
      gap: 5px;
      padding: 11px 13px;
      border: 1px solid #fff9;
      border-radius: 13px;
      background: linear-gradient(145deg, #30294b, #17162d);
      box-shadow: 0 8px 20px #0008;
      color: #fff;
      cursor: pointer;
      pointer-events: auto;
      text-align: left;
      animation: popupIn 180ms ease both;
    }
    .distraction-popup strong { font-size: 12px; }
    .distraction-popup span { color: #d1c9df; font-size: 10px; line-height: 1.35; }
    .distraction-popup.youtube { border-color: #ff657788; background: linear-gradient(145deg, #572b43, #24182e); }
    .distraction-popup.red { border-color: #ff8a9b88; }
    .distraction-popup.blue { border-color: #80dcff88; }
    .distraction-popup.phone { border-color: #a4ffbf88; }
    .distraction-popup.ad { border-color: #ffe17c99; background: linear-gradient(145deg, #50422a, #25202d); }
    @keyframes popupIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
    .writing-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
    .write-button { min-width: 190px; user-select: none; touch-action: none; }
    .write-button.writing { background: linear-gradient(135deg, #c994ff, #8b75f4); }
    .writing-controls .fan-tip { margin: 0; }
    .rhythm-hud { max-width: 800px; }
    .rhythm-song { color: #e9caff; font-family: "Courier New", monospace; }
    .rhythm-song strong { display: block; margin-top: 4px; color: #ffe18d; text-align: center; }
    .rhythm-canvas { background: #111023; }
    .rhythm-controls button { min-width: 57px; font-size: 22px; }
    .rhythm-defeat { margin: 22px auto 0; padding: 24px; border: 1px solid #ff9bcf77; border-radius: 18px; background: linear-gradient(145deg, #3e2347, #211d3c); animation: arrive 300ms ease both; }

    function selectCharacter(id) {
      cleanupMinigames();
      selectedCharacterId = id;
      character = characters[id];
      const progress = progressByCharacter[id];
      if (progress.eventIndex >= character.events.length) {
        progress.eventIndex = 0;
        progress.openedChests = new Set();
      }
      eventIndex = progress.eventIndex;
      openedChests = progress.openedChests;
      screen = eventIndex >= character.events.length ? "complete" : "event";
      render();
    }

    function saveProgress() {
      if (selectedCharacterId) {

            <div class="progress-fill" style="width:${percent}%"></div>
          </div>
          <div class="event-content">${renderEventContent(event)}</div>

    }

    function renderShoppingStage() {

      const stage = document.getElementById("shopping-stage");
      const roundLabel = document.getElementById("shopping-round");
      const mistakesLabel = document.getElementById("shopping-mistakes");

      const round = SHOPPING_ROUNDS[shoppingGame.round];
      roundLabel.textContent = `ROUND ${shoppingGame.round + 1} / ${SHOPPING_ROUNDS.length} · ${round.aisleName}`;
      mistakesLabel.textContent = `MISTAKES · ${shoppingGame.mistakes} / 3`;
      stage.innerHTML = `
        <p class="event-copy">Find these products before Father asks where the cheese aisle went:</p>

          ${round.items.map((item) => `<span class="shopping-item${shoppingGame.collected.has(item.name) ? " done" : ""}">${shoppingGame.collected.has(item.name) ? "✓ " : "□ "}${item.name}</span>`).join("")}

          ${round.aisles.map((aisle, index) => `<button class="aisle-tab" type="button" data-aisle="${index}" aria-pressed="${shoppingGame.aisle === index}">${aisle.name}</button>`).join("")}

        <div class="store-products">
          ${round.aisles[shoppingGame.aisle].products.map((product) => {

        button.addEventListener("click", () => {
          shoppingGame.aisle = Number(button.dataset.aisle);
          renderShoppingStage();

    function chooseComputerProblem(event) {
      const level = multi.computerSolved < 3 ? 1 : multi.computerSolved < 6 ? 2 : 3;
      const available = event.computerProblems.filter((problem) =>
        problem.level === level && !multi.usedComputerProblems.includes(problem.id)
      );
      const problem = available[Math.floor(Math.random() * available.length)];
      multi.usedComputerProblems.push(problem.id);
      const choices = [problem.solution, ...problem.distractors];
      for (let index = choices.length - 1; index > 0; index--) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [choices[index], choices[swapIndex]] = [choices[swapIndex], choices[index]];
      }
      return { ...problem, choices };
    }

    function generateFanMaze(size, seed) {
      const grid = Array.from({ length: size }, () => Array(size).fill(1));
      let state = seed >>> 0;
      const random = (maximum) => {
        state = (state * 1664525 + 1013904223) >>> 0;
        return state % maximum;
      };
      const stack = [[1, 1]];
      grid[1][1] = 0;
      while (stack.length) {
        const [x, y] = stack[stack.length - 1];
        const neighbors = [[0, -2], [2, 0], [0, 2], [-2, 0]]
          .filter(([dx, dy]) => x + dx > 0 && x + dx < size - 1 && y + dy > 0 && y + dy < size - 1 && grid[y + dy][x + dx] === 1);
        if (!neighbors.length) {
          stack.pop();
          continue;
        }
        const [dx, dy] = neighbors[random(neighbors.length)];
        grid[y + dy / 2][x + dx / 2] = 0;
        grid[y + dy][x + dx] = 0;
        stack.push([x + dx, y + dy]);
      }
      return grid;
    }

    function createMazeExits(size, grid) {
      const last = size - 2;
      let center = Math.floor(last / 2);
      if (center % 2 === 0) center -= 1;
      const cells = [
        [1, center], [center, 1], [last, center], [center, last],
        [last, 1], [1, last], [last, last], [center, center], [1, 5]
      ];
      return cells
        .filter(([x, y]) => grid[y]?.[x] === 0)
        .map(([x, y]) => ({ x: x + 0.5, y: y + 0.5 }));
    }

    function prepareMaze(event) {
      cleanupMaze();
      const canvas = document.getElementById("maze-canvas");
      const night = event.maze === "night";
      const size = night ? 27 : 25;
      const grid = generateFanMaze(size, night ? 0x7f4a91 : 0x4917d3);
      mazeGame = {
        event,
        canvas,
        context: canvas.getContext("2d"),
        grid,
        player: { x: 1.5, y: 1.5, angle: night ? 0.12 : 0 },
        exits: createMazeExits(size, grid),
        elapsed: 0,
        lastTime: performance.now(),
        night,
        active: true,
        startedAt: performance.now()
      };
      bindHeldControls("[data-maze-key]");
      drawMaze();
      mazeFrame = requestAnimationFrame(updateMaze);
    }

    function updateMaze(timestamp) {
      if (!mazeGame || !mazeGame.active) return;
      const delta = Math.min((timestamp - mazeGame.lastTime) / 1000, 0.05);
      mazeGame.lastTime = timestamp;
      mazeGame.elapsed += delta;
      const keys = heldKeys;
      const turn = Number(keys.has("d") || keys.has("arrowright")) - Number(keys.has("a") || keys.has("arrowleft"));
      const forward = Number(keys.has("w") || keys.has("arrowup")) - Number(keys.has("s") || keys.has("arrowdown"));
      mazeGame.player.angle += turn * delta * 1.9;
      if (forward) {
        const speed = forward * delta * 2.45;
        const nextX = mazeGame.player.x + Math.cos(mazeGame.player.angle) * speed;
        const nextY = mazeGame.player.y + Math.sin(mazeGame.player.angle) * speed;
        if (canStandInMaze(nextX, mazeGame.player.y)) mazeGame.player.x = nextX;
        if (canStandInMaze(mazeGame.player.x, nextY)) mazeGame.player.y = nextY;
      }

      const clock = document.getElementById("maze-clock");
      const status = document.getElementById("maze-status");
      const dayReady = !mazeGame.event.dayDuration || mazeGame.elapsed >= mazeGame.event.dayDuration;
      if (clock) {
        if (mazeGame.event.dayDuration) {
          const minutes = 8 * 60 + Math.floor(Math.min(1, mazeGame.elapsed / mazeGame.event.dayDuration) * 540);
          clock.textContent = `${String(Math.floor(minutes / 60)).padStart(2, "0")}:${String(minutes % 60).padStart(2, "0")}`;
        } else {
          const dreamMinutes = (21 * 60 + Math.floor(mazeGame.elapsed * 6)) % (24 * 60);
          clock.textContent = `${String(Math.floor(dreamMinutes / 60)).padStart(2, "0")}:${String(dreamMinutes % 60).padStart(2, "0")}`;
        }
      }
      if (status) status.textContent = dayReady
        ? `${mazeGame.exits.length} ${mazeGame.night ? "PORTALS OPEN" : "EXITS OPEN · FAN WAKES"}`
        : (mazeGame.night ? `${mazeGame.exits.length} PORTALS IN THE DREAM` : `WAITING FOR 17:00 · ${mazeGame.exits.length} EXITS`);
      drawMaze();

      if (dayReady && mazeGame.exits.some((exit) => Math.hypot(mazeGame.player.x - exit.x, mazeGame.player.y - exit.y) < 0.48)) {
        mazeGame.active = false;
        completeEvent();
        return;
      }
      mazeFrame = requestAnimationFrame(updateMaze);
    }

    function canStandInMaze(x, y) {
      const grid = mazeGame.grid;
      const radius = 0.2;
      return grid[Math.floor(y - radius)]?.[Math.floor(x - radius)] === 0 &&
        grid[Math.floor(y - radius)]?.[Math.floor(x + radius)] === 0 &&
        grid[Math.floor(y + radius)]?.[Math.floor(x - radius)] === 0 &&
        grid[Math.floor(y + radius)]?.[Math.floor(x + radius)] === 0;
    }

    function castMazeRay(angle, maxDistance = 32) {
      const { grid, player } = mazeGame;
      const dx = Math.cos(angle);
      const dy = Math.sin(angle);
      const deltaX = Math.abs(1 / (dx || 0.00001));
      const deltaY = Math.abs(1 / (dy || 0.00001));
      let mapX = Math.floor(player.x);
      let mapY = Math.floor(player.y);
      const stepX = dx < 0 ? -1 : 1;
      const stepY = dy < 0 ? -1 : 1;
      let sideX = (dx < 0 ? player.x - mapX : mapX + 1 - player.x) * deltaX;
      let sideY = (dy < 0 ? player.y - mapY : mapY + 1 - player.y) * deltaY;
      let side = 0;
      while (Math.min(sideX, sideY) < maxDistance) {
        if (sideX < sideY) {
          sideX += deltaX;
          mapX += stepX;
          side = 0;
        } else {
          sideY += deltaY;
          mapY += stepY;
          side = 1;
        }
        if (grid[mapY]?.[mapX] !== 0) {
          const distance = side === 0 ? (mapX - player.x + (1 - stepX) / 2) / dx : (mapY - player.y + (1 - stepY) / 2) / dy;
          return { distance: Math.abs(distance), side };
        }
      }
      return { distance: maxDistance, side: 0 };
    }

    function drawMaze() {
      if (!mazeGame) return;
      const { context: ctx, canvas, player, night } = mazeGame;
      const width = canvas.width;
      const height = canvas.height;
      const half = height / 2;
      const fov = Math.PI / 3;
      const ceiling = ctx.createLinearGradient(0, 0, 0, half);
      ceiling.addColorStop(0, night ? "#101932" : "#170d2a");
      ceiling.addColorStop(1, night ? "#30345c" : "#55316c");
      ctx.fillStyle = ceiling;
      ctx.fillRect(0, 0, width, half);
      const floor = ctx.createLinearGradient(0, half, 0, height);
      floor.addColorStop(0, night ? "#181b39" : "#29183d");
      floor.addColorStop(1, night ? "#070a1d" : "#100c20");
      ctx.fillStyle = floor;
      ctx.fillRect(0, half, width, half);

      for (let screenX = 0; screenX < width; screenX += 2) {
        const cameraX = (screenX / width) * 2 - 1;
        const angle = player.angle + Math.atan(cameraX * Math.tan(fov / 2));
        const hit = castMazeRay(angle);
        const distance = Math.max(0.08, hit.distance * Math.cos(angle - player.angle));
        const wallHeight = Math.min(height * 1.4, height / distance);
        const top = half - wallHeight / 2;
        const shade = Math.max(0.16, 1 - distance / 15) * (hit.side ? 0.77 : 1);
        const rgb = night ? [118, 130, 228] : [190, 113, 226];
        ctx.fillStyle = `rgb(${Math.floor(rgb[0] * shade)},${Math.floor(rgb[1] * shade)},${Math.floor(rgb[2] * shade)})`;
        ctx.fillRect(screenX, top, 2.2, wallHeight);
        ctx.fillStyle = night ? "#b9c3ff12" : "#ffdaff12";
        ctx.fillRect(screenX, top, 2.2, 2);
      }

      const dayReady = !mazeGame.event.dayDuration || mazeGame.elapsed >= mazeGame.event.dayDuration;
      for (const exit of mazeGame.exits) {
        const exitDx = exit.x - player.x;
        const exitDy = exit.y - player.y;
        const exitDistance = Math.hypot(exitDx, exitDy);
        const exitAngle = Math.atan2(exitDy, exitDx);
        const relative = Math.atan2(Math.sin(exitAngle - player.angle), Math.cos(exitAngle - player.angle));
        if (Math.abs(relative) < fov * 0.54) {
          const x = width / 2 + Math.tan(relative) / Math.tan(fov / 2) * width / 2;
          const wall = castMazeRay(exitAngle);
          if (wall.distance > exitDistance - 0.55) {
            const size = Math.min(height * 0.65, height * 0.58 / Math.max(1, exitDistance));
            const y = half;
            ctx.save();
            ctx.globalAlpha = dayReady ? 0.95 : 0.37;
            ctx.strokeStyle = dayReady ? (night ? "#a5c5ff" : "#ffe48b") : "#d99bff";
            ctx.shadowColor = ctx.strokeStyle;
            ctx.shadowBlur = dayReady ? 24 : 9;
            ctx.lineWidth = Math.max(3, size * 0.08);
            ctx.beginPath();
            ctx.ellipse(x, y, size * 0.38, size * 0.55, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
            if (dayReady && exitDistance < 8) {
              ctx.fillStyle = night ? "#d9e3ff" : "#fff0a8";
              ctx.font = "bold 15px system-ui";
              ctx.textAlign = "center";
              ctx.fillText("EXIT", x, y + size * 0.75);
            }
          }
        }
      }
    }

    function bindHeldControls(selector) {
      app.querySelectorAll(selector).forEach((button) => {
        const key = button.dataset.mazeKey || button.dataset.shooterKey;
        const press = (event) => {
          event.preventDefault();
          button.setPointerCapture(event.pointerId);
          heldKeys.add(key);
        };
        const release = () => heldKeys.delete(key);
        button.addEventListener("pointerdown", press);
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      });
    }

    function cleanupMaze() {
      if (mazeFrame) cancelAnimationFrame(mazeFrame);
      mazeFrame = 0;
      mazeGame = null;
      heldKeys.clear();
    }

    const distractionTypes = [
      { type: "youtube", title: "YouTube", message: "A video titled “One More, Then You Write” is autoplaying." },
      { type: "red", title: "Red invited you to play", message: "Red: “Quick match? It will only take a minute.”" },
      { type: "blue", title: "Blue invited you to play", message: "Blue: “I found something in Fortnite!”" },
      { type: "phone", title: "Phone notification", message: "Your phone buzzed. It refuses to say why." },
      { type: "ad", title: "Totally Random Ad", message: "A suspicious wizard wants to sell you a third keyboard." }
    ];
    const bookWordBank = "somewhere the rain remembered every name and carried it beyond the quiet town where nobody asked the moon for directions".split(" ");

    function prepareDistraction(event) {
      cleanupDistraction();
      const start = performance.now();
      distractionGame = {
        event,
        startedAt: start,
        nextSpawnAt: 8,
        lastWordAt: start,
        wordCount: 0,
        writing: false,
        wordIndex: 0,
        finished: false
      };
      const button = document.getElementById("writing-button");
      button.addEventListener("pointerdown", (pointerEvent) => {
        pointerEvent.preventDefault();
        if (!distractionGame || distractionGame.finished) return;
        button.setPointerCapture(pointerEvent.pointerId);
        distractionGame.writing = true;
        distractionGame.lastWordAt = performance.now();
        button.classList.add("writing");
        button.setAttribute("aria-pressed", "true");
        document.getElementById("distraction-status").textContent = "Fan is writing. Keep holding…";
      });
      const stopWriting = () => {
        if (!distractionGame || !distractionGame.writing) return;
        distractionGame.writing = false;
        button.classList.remove("writing");
        button.setAttribute("aria-pressed", "false");
        const status = document.getElementById("distraction-status");
        if (status) status.textContent = "Writing paused. Click a distraction or hold to continue.";
      };
      button.addEventListener("pointerup", stopWriting);
      button.addEventListener("pointercancel", stopWriting);
      button.addEventListener("lostpointercapture", stopWriting);
      distractionInterval = window.setInterval(tickDistraction, 50);
      distractionTimeout = window.setTimeout(finishDistraction, event.duration * 1000);
    }

    function tickDistraction() {
      if (!distractionGame || distractionGame.finished) return;
      const now = performance.now();
      const elapsed = (now - distractionGame.startedAt) / 1000;
      const remaining = Math.max(0, distractionGame.event.duration - elapsed);
      const clock = document.getElementById("distraction-clock");
      if (clock) clock.textContent = remaining.toFixed(1);
      if (elapsed >= distractionGame.nextSpawnAt) {
        const batchSize = elapsed >= 45 ? 2 + Math.floor(Math.random() * 2) : 1;
        for (let index = 0; index < batchSize; index++) spawnDistraction();
        const interval = elapsed < 15 ? 10 : elapsed < 30 ? 5 : elapsed < 45 ? Math.max(1.1, 4.5 - (elapsed - 30) * 0.22) : 1.35;
        distractionGame.nextSpawnAt = elapsed + interval;
      }
      if (distractionGame.writing && now - distractionGame.lastWordAt >= distractionGame.event.wordInterval) {
        distractionGame.lastWordAt = now;
        const word = bookWordBank[distractionGame.wordIndex % bookWordBank.length];
        distractionGame.wordIndex += 1;
        distractionGame.wordCount += 1;
        const output = document.getElementById("book-words");
        if (output) output.appendChild(document.createTextNode(`${word} `));
        const count = document.getElementById("word-count");
        if (count) count.textContent = `${distractionGame.wordCount} / ${distractionGame.event.wordGoal}`;
      }
      if (elapsed >= distractionGame.event.duration) finishDistraction();
    }

    function spawnDistraction() {
      if (!distractionGame) return;
      const layer = document.getElementById("distraction-layer");
      if (!layer) return;
      const distraction = distractionTypes[Math.floor(Math.random() * distractionTypes.length)];
      const popup = document.createElement("button");
      popup.type = "button";
      popup.className = `distraction-popup ${distraction.type}`;
      const layerWidth = Math.max(1, layer.clientWidth);
      const popupWidth = Math.min(230, layerWidth * 0.7);
      const maxLeft = Math.max(5, 95 - popupWidth / layerWidth * 100);
      popup.style.left = `${5 + Math.random() * maxLeft}%`;
      popup.style.top = `${8 + Math.random() * 63}%`;
      const title = document.createElement("strong");
      title.textContent = distraction.title;
      const message = document.createElement("span");
      message.textContent = distraction.message;
      const dismiss = document.createElement("span");
      dismiss.textContent = "Click to dismiss";
      popup.append(title, message, dismiss);
      popup.addEventListener("click", () => {
        if (!distractionGame || distractionGame.finished) return;
        distractionGame.writing = false;
        const writeButton = document.getElementById("writing-button");
        if (writeButton) {
          writeButton.classList.remove("writing");
          writeButton.setAttribute("aria-pressed", "false");
        }
        popup.remove();
        const status = document.getElementById("distraction-status");
        if (status) status.textContent = "Distraction dismissed. Hold to get back to the book.";
      });
      layer.appendChild(popup);
    }

    function finishDistraction() {
      if (!distractionGame || distractionGame.finished) return;
      distractionGame.finished = true;
      completeEvent();
    }

    function cleanupDistraction() {
      if (distractionInterval) window.clearInterval(distractionInterval);
      if (distractionTimeout) window.clearTimeout(distractionTimeout);
      distractionInterval = 0;
      distractionTimeout = 0;
      distractionGame = null;
    }

    function prepareRhythm(event) {
      cleanupRhythm();
      const canvas = document.getElementById("rhythm-canvas");
      rhythmGame = {
        event,
        canvas,
        context: canvas.getContext("2d"),
        active: false,
        ended: false,
        startedAt: 0,
        elapsed: 0,
        lastTime: 0,
        nextSpawn: 0.6,
        nextBeat: 0,
        notes: [],
        fanScore: 0,
        redScore: 0,
        misses: 0,
        audio: null
      };
      document.getElementById("rhythm-start").addEventListener("click", startRhythm);
      document.getElementById("rhythm-continue").addEventListener("click", completeEvent);
      app.querySelectorAll("[data-rhythm-key]").forEach((button) => {
        button.addEventListener("click", () => hitRhythmLane(Number(button.dataset.rhythmKey)));
      });
      drawRhythm();
    }

    function startRhythm() {
      if (!rhythmGame || rhythmGame.active || rhythmGame.ended) return;
      rhythmGame.active = true;
      rhythmGame.startedAt = performance.now();
      rhythmGame.lastTime = rhythmGame.startedAt;
      rhythmGame.nextBeat = 0;
      const start = document.getElementById("rhythm-start");
      if (start) start.hidden = true;
      createRhythmAudio();
      rhythmTimeout = window.setTimeout(finishRhythm, rhythmGame.event.duration * 1000);
      rhythmFrame = requestAnimationFrame(updateRhythm);
    }

    function rhythmStage(elapsed) {
      if (elapsed < 15) return 0;
      if (elapsed < 30) return 1;
      if (elapsed < 45) return 2;
      return 3;
    }

    function rhythmTempo(stage) {
      return [92, 132, 172, 212][stage];
    }

    function spawnRhythmNotes() {
      const stage = rhythmStage(rhythmGame.elapsed);
      const count = stage === 0 ? 1 : stage === 1 ? 1 + Math.floor(Math.random() * 2) : stage === 2 ? 2 + Math.floor(Math.random() * 2) : 3 + Math.floor(Math.random() * 2);
      const lanes = [0, 1, 2, 3];
      for (let index = lanes.length - 1; index > 0; index--) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [lanes[index], lanes[swapIndex]] = [lanes[swapIndex], lanes[index]];
      }
      const speed = [150, 195, 245, 300][stage];
      for (let index = 0; index < count; index++) rhythmGame.notes.push({ lane: lanes[index], y: -25, speed, fanHit: false, redHit: false });
    }

    function updateRhythm(timestamp) {
      if (!rhythmGame || !rhythmGame.active) return;
      rhythmGame.elapsed = (timestamp - rhythmGame.startedAt) / 1000;
      if (rhythmGame.elapsed >= rhythmGame.event.duration) {
        finishRhythm();
        return;
      }
      const delta = Math.min((timestamp - rhythmGame.lastTime) / 1000, 0.05);
      rhythmGame.lastTime = timestamp;
      const stage = rhythmStage(rhythmGame.elapsed);
      const spawnIntervals = [0.92, 0.62, 0.39, 0.23];
      if (rhythmGame.elapsed >= rhythmGame.nextSpawn) {
        spawnRhythmNotes();
        rhythmGame.nextSpawn = rhythmGame.elapsed + spawnIntervals[stage];
      }
      const targetY = rhythmGame.canvas.height * 0.72;
      for (let index = rhythmGame.notes.length - 1; index >= 0; index--) {
        const note = rhythmGame.notes[index];
        note.y += note.speed * delta;
        if (!note.redHit && note.y >= targetY) {
          note.redHit = true;
          rhythmGame.redScore += 1;
        }
        if (!note.fanHit && note.y > targetY + 45) rhythmGame.misses += 1;
        if (note.y > rhythmGame.canvas.height + 35) rhythmGame.notes.splice(index, 1);
      }
      const clock = document.getElementById("rhythm-clock");
      const tempo = document.getElementById("rhythm-tempo");
      const fanScore = document.getElementById("fan-rhythm-score");
      const redScore = document.getElementById("red-rhythm-score");
      if (clock) clock.textContent = `${Math.max(0, rhythmGame.event.duration - rhythmGame.elapsed).toFixed(1)}s`;
      if (tempo) tempo.textContent = ["NORMAL", "FASTER", "VERY FAST", "OVERWHELMING"][stage];
      if (fanScore) fanScore.textContent = `${rhythmGame.fanScore} · ${rhythmGame.misses} MISSED`;
      if (redScore) redScore.textContent = rhythmGame.redScore;
      tickRhythmAudio();
      drawRhythm();
      rhythmFrame = requestAnimationFrame(updateRhythm);
    }

    function hitRhythmLane(lane) {
      if (!rhythmGame || !rhythmGame.active || lane < 0 || lane > 3) return;
      const targetY = rhythmGame.canvas.height * 0.72;
      let candidate = null;
      let bestDistance = 48;
      for (const note of rhythmGame.notes) {
        const distance = Math.abs(note.y - targetY);
        if (note.lane === lane && !note.fanHit && distance < bestDistance) {
          candidate = note;
          bestDistance = distance;
        }
      }
      if (!candidate) return;
      candidate.fanHit = true;
      rhythmGame.fanScore += 1;
      const score = document.getElementById("fan-rhythm-score");
      if (score) score.textContent = `${rhythmGame.fanScore} · ${rhythmGame.misses} MISSED`;
    }

    function drawRhythm() {
      if (!rhythmGame) return;
      const { context: ctx, canvas, notes } = rhythmGame;
      const width = canvas.width;
      const height = canvas.height;
      const targetY = height * 0.72;
      const laneX = (side, lane) => side * (width / 2) + 52 + lane * 78;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#171326";
      ctx.fillRect(0, 0, width / 2, height);
      ctx.fillStyle = "#26162a";
      ctx.fillRect(width / 2, 0, width / 2, height);
      ctx.fillStyle = "#d5a5ff";
      ctx.font = "800 16px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("FAN", width / 4, 27);
      ctx.fillStyle = "#ffb0ca";
      ctx.fillText("RED · PERFECT", width * 0.75, 27);
      ctx.strokeStyle = "#ffffff23";
      ctx.beginPath();
      ctx.moveTo(width / 2, 0);
      ctx.lineTo(width / 2, height);
      ctx.stroke();
      const symbols = ["←", "↓", "↑", "→"];
      for (let side = 0; side < 2; side++) {
        for (let lane = 0; lane < 4; lane++) {
          const x = laneX(side, lane);
          ctx.fillStyle = side === 0 ? "#d4a7ff22" : "#ff9fca22";
          ctx.fillRect(x - 25, 45, 50, height - 60);
          ctx.strokeStyle = side === 0 ? "#d2a4ff99" : "#ffadc988";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(x - 25, targetY - 25, 50, 50, 11);
          ctx.stroke();
          ctx.fillStyle = side === 0 ? "#ead7ff" : "#ffd5e4";
          ctx.font = "bold 28px system-ui";
          ctx.fillText(symbols[lane], x, targetY + 10);
        }
      }
      for (const note of notes) {
        for (let side = 0; side < 2; side++) {
          const x = laneX(side, note.lane);
          const hit = side === 0 ? note.fanHit : note.redHit;
          ctx.fillStyle = side === 0 ? (hit ? "#87f0b5" : "#d29aff") : (hit ? "#ffb0ca" : "#ff7d9d");
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = hit ? 3 : 12;
          ctx.font = "bold 31px system-ui";
          ctx.fillText(symbols[note.lane], x, note.y);
          ctx.shadowBlur = 0;
        }
      }
    }

    function createRhythmAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext || !rhythmGame) return;
      rhythmGame.audio = new AudioContext();
      const audio = rhythmGame.audio;
      audio.resume().catch(() => {
        if (rhythmGame && rhythmGame.audio === audio) {
          audio.close();
          rhythmGame.audio = null;
          const status = document.getElementById("rhythm-status");
          if (status) status.textContent = "Audio is unavailable; follow the visual beat.";
        }
      });
    }

    function tickRhythmAudio() {
      if (!rhythmGame || !rhythmGame.audio || rhythmGame.elapsed < rhythmGame.nextBeat) return;
      const stage = rhythmStage(rhythmGame.elapsed);
      const audio = rhythmGame.audio;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      const beat = Math.floor(rhythmGame.elapsed * rhythmTempo(stage) / 60);
      oscillator.type = beat % 4 === 0 ? "square" : "sine";
      oscillator.frequency.value = beat % 4 === 0 ? 110 : [220, 277, 330, 277][beat % 4];
      gain.gain.setValueAtTime(0.035, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.11);
      oscillator.connect(gain);
      gain.connect(audio.destination);
      oscillator.start();
      oscillator.stop(audio.currentTime + 0.12);
      rhythmGame.nextBeat = rhythmGame.elapsed + 60 / rhythmTempo(stage);
    }

    function finishRhythm() {
      if (!rhythmGame || rhythmGame.ended) return;
      rhythmGame.active = false;
      rhythmGame.ended = true;
      rhythmGame.notes = [];
      if (rhythmFrame) cancelAnimationFrame(rhythmFrame);
      rhythmFrame = 0;
      if (rhythmTimeout) window.clearTimeout(rhythmTimeout);
      rhythmTimeout = 0;
      const canvas = document.getElementById("rhythm-canvas");
      const controls = app.querySelector(".rhythm-controls");
      const status = document.getElementById("rhythm-status");
      const defeat = document.getElementById("rhythm-defeat");
      const start = document.getElementById("rhythm-start");
      if (canvas) {
        drawRhythm();
        canvas.hidden = true;
      }
      if (controls) controls.hidden = true;
      if (status) status.hidden = true;
      if (start) start.hidden = true;
      if (defeat) defeat.hidden = false;
      if (rhythmGame.audio) {
        rhythmGame.audio.close();
        rhythmGame.audio = null;
      }
    }

    function cleanupRhythm() {
      if (rhythmFrame) cancelAnimationFrame(rhythmFrame);
      if (rhythmTimeout) window.clearTimeout(rhythmTimeout);
      rhythmFrame = 0;
      rhythmTimeout = 0;
      if (rhythmGame && rhythmGame.audio) rhythmGame.audio.close();
      rhythmGame = null;
    }

    function createShooterMap() {
      const size = 17;
      const map = Array.from({ length: size }, (_, y) =>
        Array.from({ length: size }, (_, x) => x === 0 || y === 0 || x === size - 1 || y === size - 1 ? 1 : 0)
      );
      const vertical = (x, start, end, gap) => {
        for (let y = start; y <= end; y++) if (y !== gap) map[y][x] = 1;
      };
      const horizontal = (y, start, end, gap) => {
        for (let x = start; x <= end; x++) if (x !== gap) map[y][x] = 1;
      };
      vertical(6, 2, 8, 5);
      horizontal(9, 2, 6, 4);
      vertical(11, 1, 5, 3);
      horizontal(7, 8, 14, 10);
      vertical(4, 11, 14, 12);
      horizontal(12, 7, 14, 13);
      vertical(14, 8, 11, 9);
      map[3][8] = 1;
      map[3][9] = 1;
      map[4][9] = 1;
      map[13][8] = 1;
      return map;
    }

    function prepareShooter(event) {
      cleanupShooter();
      const canvas = document.getElementById("shooter-canvas");
      shooterGame = {
        event,
        canvas,
        context: canvas.getContext("2d"),
        map: createShooterMap(),
        player: { x: 2.5, y: 2.5, angle: 0 },
        enemies: [
          { x: 8.5, y: 4.5, alive: true, color: "#ff727f" },
          { x: 13.5, y: 4.5, alive: true, color: "#ffd166" },
          { x: 2.5, y: 13.5, alive: true, color: "#70d6ff" },
          { x: 9.5, y: 10.5, alive: true, color: "#b388ff" },
          { x: 14.5, y: 14.5, alive: true, color: "#83f0bd" }
        ],
        ammo: 6,
        maxAmmo: 6,
        reloadRemaining: 0,
        active: true,
        pointerX: null,
        dragged: false,
        lastTime: performance.now()
      };
      bindHeldControls("[data-shooter-key]");
      canvas.addEventListener("pointerdown", (pointerEvent) => {
        shooterGame.pointerX = pointerEvent.clientX;
        shooterGame.dragged = false;
        canvas.setPointerCapture(pointerEvent.pointerId);
        pointerEvent.preventDefault();
      });
      canvas.addEventListener("pointermove", (pointerEvent) => {
        if (!shooterGame || shooterGame.pointerX === null) return;
        const dx = pointerEvent.clientX - shooterGame.pointerX;
        if (Math.abs(dx) > 1) shooterGame.dragged = true;
        shooterGame.player.angle += dx * 0.006;
        shooterGame.pointerX = pointerEvent.clientX;
      });
      canvas.addEventListener("pointerup", () => {
        if (!shooterGame) return;
        if (!shooterGame.dragged) shootAtCenter();
        shooterGame.pointerX = null;
      });
      canvas.addEventListener("pointercancel", () => { if (shooterGame) shooterGame.pointerX = null; });
      document.getElementById("shooter-fire").addEventListener("click", shootAtCenter);
      document.getElementById("shooter-reload").addEventListener("click", reloadShooter);
      drawShooter();
      shooterFrame = requestAnimationFrame(updateShooter);
    }

    function canStandInShooter(x, y) {
      const map = shooterGame.map;
      const radius = 0.19;
      return map[Math.floor(y - radius)]?.[Math.floor(x - radius)] === 0 &&
        map[Math.floor(y - radius)]?.[Math.floor(x + radius)] === 0 &&
        map[Math.floor(y + radius)]?.[Math.floor(x - radius)] === 0 &&
        map[Math.floor(y + radius)]?.[Math.floor(x + radius)] === 0;
    }

    function updateShooter(timestamp) {
      if (!shooterGame || !shooterGame.active) return;
      const delta = Math.min((timestamp - shooterGame.lastTime) / 1000, 0.05);
      shooterGame.lastTime = timestamp;
      const keys = heldKeys;
      const turn = Number(keys.has("right") || keys.has("arrowright")) - Number(keys.has("left") || keys.has("arrowleft"));
      shooterGame.player.angle += turn * delta * 2.1;
      const forward = Number(keys.has("forward") || keys.has("w") || keys.has("arrowup")) -
        Number(keys.has("back") || keys.has("s") || keys.has("arrowdown"));
      const strafe = Number(keys.has("d")) - Number(keys.has("a"));
      const speed = 2.8 * delta;
      const moveX = Math.cos(shooterGame.player.angle) * forward * speed - Math.sin(shooterGame.player.angle) * strafe * speed;
      const moveY = Math.sin(shooterGame.player.angle) * forward * speed + Math.cos(shooterGame.player.angle) * strafe * speed;
      if (canStandInShooter(shooterGame.player.x + moveX, shooterGame.player.y)) shooterGame.player.x += moveX;
      if (canStandInShooter(shooterGame.player.x, shooterGame.player.y + moveY)) shooterGame.player.y += moveY;
      if (shooterGame.reloadRemaining > 0) {
        shooterGame.reloadRemaining = Math.max(0, shooterGame.reloadRemaining - delta);
        if (shooterGame.reloadRemaining === 0) {
          shooterGame.ammo = shooterGame.maxAmmo;
          updateShooterHud("Magazine reloaded.");
        }
      }
      drawShooter();
      shooterFrame = requestAnimationFrame(updateShooter);
    }

    function castShooterRay(angle, maxDistance = 32) {
      const { map, player } = shooterGame;
      const dx = Math.cos(angle);
      const dy = Math.sin(angle);
      const deltaX = Math.abs(1 / (dx || 0.00001));
      const deltaY = Math.abs(1 / (dy || 0.00001));
      let mapX = Math.floor(player.x);
      let mapY = Math.floor(player.y);
      const stepX = dx < 0 ? -1 : 1;
      const stepY = dy < 0 ? -1 : 1;
      let sideX = (dx < 0 ? player.x - mapX : mapX + 1 - player.x) * deltaX;
      let sideY = (dy < 0 ? player.y - mapY : mapY + 1 - player.y) * deltaY;
      let side = 0;
      while (Math.min(sideX, sideY) < maxDistance) {
        if (sideX < sideY) {
          sideX += deltaX;
          mapX += stepX;
          side = 0;
        } else {
          sideY += deltaY;
          mapY += stepY;
          side = 1;
        }
        if (map[mapY]?.[mapX] !== 0) {
          const distance = side === 0 ? (mapX - player.x + (1 - stepX) / 2) / dx : (mapY - player.y + (1 - stepY) / 2) / dy;
          return { distance: Math.abs(distance), side };
        }
      }
      return { distance: maxDistance, side: 0 };
    }

    function drawShooter() {
      if (!shooterGame) return;
      const { context: ctx, canvas, player } = shooterGame;
      const width = canvas.width;
      const height = canvas.height;
      const half = height / 2;
      const fov = Math.PI * 0.42;
      const ceiling = ctx.createLinearGradient(0, 0, 0, half);
      ceiling.addColorStop(0, "#11132f");
      ceiling.addColorStop(1, "#43366c");
      ctx.fillStyle = ceiling;
      ctx.fillRect(0, 0, width, half);
      const floor = ctx.createLinearGradient(0, half, 0, height);
      floor.addColorStop(0, "#36324c");
      floor.addColorStop(1, "#111222");
      ctx.fillStyle = floor;
      ctx.fillRect(0, half, width, half);
      const depthBuffer = new Float32Array(width);
      for (let screenX = 0; screenX < width; screenX += 2) {
        const cameraX = (screenX / width) * 2 - 1;
        const angle = player.angle + Math.atan(cameraX * Math.tan(fov / 2));
        const hit = castShooterRay(angle);
        const distance = Math.max(0.08, hit.distance * Math.cos(angle - player.angle));
        const wallHeight = Math.min(height * 1.7, height / distance);
        const top = half - wallHeight / 2;
        const shade = Math.max(0.18, 1 - distance / 17) * (hit.side ? 0.72 : 1);
        ctx.fillStyle = `rgb(${Math.floor(111 * shade)},${Math.floor(91 * shade)},${Math.floor(168 * shade)})`;
        ctx.fillRect(screenX, top, 2.2, wallHeight);
        ctx.fillStyle = "#d5b9ff20";
        ctx.fillRect(screenX, top, 2.2, 3);
        depthBuffer[screenX] = distance;
        if (screenX + 1 < width) depthBuffer[screenX + 1] = distance;
      }

      const enemies = shooterGame.enemies
        .filter((enemy) => enemy.alive)
        .map((enemy) => {
          const dx = enemy.x - player.x;
          const dy = enemy.y - player.y;
          const distance = Math.hypot(dx, dy);
          const relative = Math.atan2(Math.sin(Math.atan2(dy, dx) - player.angle), Math.cos(Math.atan2(dy, dx) - player.angle));
          return { enemy, distance, relative, depth: distance * Math.cos(relative) };
        })
        .filter((item) => Math.abs(item.relative) < fov / 2 && item.distance > 0.25)
        .sort((a, b) => b.depth - a.depth);
      for (const item of enemies) {
        const screenX = width / 2 + Math.tan(item.relative) / Math.tan(fov / 2) * width / 2;
        const bufferX = Math.max(0, Math.min(width - 1, Math.round(screenX)));
        if (depthBuffer[bufferX] < item.depth - 0.18) continue;
        const size = Math.min(height * 0.8, height * 0.68 / item.depth);
        drawShooterEnemy(ctx, screenX, half + size * 0.3, size, item.enemy.color);
      }

      ctx.fillStyle = "#c8bddb";
      ctx.fillRect(0, half, width, 2);
      ctx.fillStyle = "#b5a2e3";
      ctx.font = "11px system-ui";
      ctx.textAlign = "left";
      ctx.fillText("DREAM ISLAND · NORTH", 16, height - 14);
      if (shooterGame.reloadRemaining > 0) {
        ctx.fillStyle = "#fff0a8";
        ctx.font = "bold 18px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("RELOADING…", width / 2, height - 32);
      }
      const ammo = document.getElementById("shooter-ammo");
      if (ammo) ammo.textContent = `AMMO · ${shooterGame.ammo} / ${shooterGame.maxAmmo}`;
    }

    function drawShooterEnemy(ctx, x, feetY, size, color) {
      const width = Math.max(12, size * 0.43);
      ctx.save();
      ctx.fillStyle = "#09081788";
      ctx.beginPath();
      ctx.ellipse(x, feetY, width * 0.72, Math.max(3, size * 0.07), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#22203a";
      ctx.fillRect(x - width * 0.42, feetY - size * 0.36, width * 0.28, size * 0.36);
      ctx.fillRect(x + width * 0.14, feetY - size * 0.36, width * 0.28, size * 0.36);
      ctx.fillStyle = color;
      ctx.fillRect(x - width / 2, feetY - size * 0.78, width, size * 0.47);
      ctx.fillStyle = "#edc0b4";
      ctx.beginPath();
      ctx.arc(x, feetY - size * 0.87, width * 0.31, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#2a1b37";
      ctx.fillRect(x - width * 0.34, feetY - size * 0.91, width * 0.68, size * 0.11);
      ctx.restore();
    }

    function shootAtCenter() {
      if (!shooterGame || !shooterGame.active) return;
      if (shooterGame.reloadRemaining > 0) return;
      if (shooterGame.ammo <= 0) {
        updateShooterHud("Out of ammo. Reload with R or the reload button.");
        return;
      }
      shooterGame.ammo -= 1;
      const fov = Math.PI * 0.42;
      const wallDistance = castShooterRay(shooterGame.player.angle).distance;
      const target = shooterGame.enemies
        .filter((enemy) => enemy.alive)
        .map((enemy) => {
          const dx = enemy.x - shooterGame.player.x;
          const dy = enemy.y - shooterGame.player.y;
          const distance = Math.hypot(dx, dy);
          const angle = Math.atan2(Math.sin(Math.atan2(dy, dx) - shooterGame.player.angle), Math.cos(Math.atan2(dy, dx) - shooterGame.player.angle));
          return { enemy, distance, angle };
        })
        .filter((item) => Math.abs(item.angle) < fov / 32 && item.distance * Math.cos(item.angle) < wallDistance)
        .sort((a, b) => a.distance - b.distance)[0];
      if (target) {
        target.enemy.alive = false;
        const remaining = shooterGame.enemies.filter((enemy) => enemy.alive).length;
        const label = document.getElementById("shooter-remaining");
        if (label) label.textContent = `ENEMIES LEFT · ${remaining}`;
        if (remaining === 0) {
          shooterGame.active = false;
          completeEvent();
          return;
        }
        updateShooterHud("Opponent tagged! They were standing very still about it.");
      } else {
        updateShooterHud("Miss. No enemies were harmed by that dramatic shot.");
      }
      drawShooter();
    }

    function reloadShooter() {
      if (!shooterGame || !shooterGame.active || shooterGame.reloadRemaining > 0 || shooterGame.ammo === shooterGame.maxAmmo) return;
      shooterGame.reloadRemaining = 1.15;
      updateShooterHud("Reloading… the opponents remain politely stationary.");
    }

    function updateShooterHud(message) {
      const status = document.getElementById("shooter-status");
      if (status) status.textContent = message;
    }

    function cleanupShooter() {
      if (shooterFrame) cancelAnimationFrame(shooterFrame);
      shooterFrame = 0;
      shooterGame = null;
      heldKeys.clear();
    }

    function prepareBoss(event) {
      cleanupBoss();
      const canvas = document.getElementById("arena");
      if (event.immortal) nightmareHits = 0;
      boss = {
        event,
        canvas,
        context: canvas.getContext("2d"),
        x: ARENA_WIDTH / 2,
        y: ARENA_HEIGHT / 2,
        elapsed: 0,
        lastTime: 0,
        spawnIn: 0.5,
        bullets: [],
        lives: event.lives || 6,
        maxLives: event.lives || 6,
        invulnerable: 0,
        pointerDown: false,
        pointerTarget: null,
        active: false,
        audio: null,
        nextBeat: 0,
        beatCount: 0,
        endTimer: 0
      };
      drawArena();
      document.getElementById("battle-start").addEventListener("click", startBoss);
      canvas.addEventListener("pointerdown", (pointerEvent) => {
        if (!boss || !boss.active) return;
        canvas.setPointerCapture(pointerEvent.pointerId);
        boss.pointerDown = true;
        setPointerTarget(pointerEvent);
      });
      canvas.addEventListener("pointermove", (pointerEvent) => {
        if (boss && boss.active && boss.pointerDown) setPointerTarget(pointerEvent);
      });
      canvas.addEventListener("pointerup", () => { if (boss) boss.pointerDown = false; });
      canvas.addEventListener("pointercancel", () => { if (boss) boss.pointerDown = false; });
      app.querySelectorAll("[data-key]").forEach((button) => {
        const key = button.dataset.key;
        button.addEventListener("pointerdown", (pointerEvent) => {
          pointerEvent.preventDefault();
          button.setPointerCapture(pointerEvent.pointerId);
          heldKeys.add(key);
        });
        const release = () => heldKeys.delete(key);
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      });
    }

    function setPointerTarget(pointerEvent) {
      if (!boss) return;
      const bounds = boss.canvas.getBoundingClientRect();
      boss.pointerTarget = {
        x: (pointerEvent.clientX - bounds.left) * ARENA_WIDTH / bounds.width,
        y: (pointerEvent.clientY - bounds.top) * ARENA_HEIGHT / bounds.height
      };
    }

    function startBoss() {
      if (!boss) return;
      boss.active = true;
      boss.lastTime = performance.now();
      boss.nextBeat = 0;
      document.getElementById("battle-start").disabled = true;
      const timer = document.getElementById("timer-label");
      if (timer) {
        timer.textContent = boss.event.phases
          ? `PHASE 1 · 15.0s · TOTAL ${boss.event.duration.toFixed(1)}s`
          : `SURVIVE · ${(boss.event.duration || 10).toFixed(1)}s`;
      }
      if (boss.event.pattern === "nightmare") startBossMusic();
      boss.endTimer = window.setTimeout(() => {
        if (boss && boss.active) completeEvent();
      }, (boss.event.duration || 10) * 1000);
      animationFrame = requestAnimationFrame(updateBoss);
    }

    function spawnBullet(x, y, angle, speed, shape = "orb") {
      boss.bullets.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: shape === "diamond" ? 9 : 8, shape });
    }

    function spawnAttack() {
      const event = boss.event;
      if (event.pattern === "fan") {
        const originX = 105 + Math.random() * (ARENA_WIDTH - 210);
        const angle = Math.atan2(boss.y - 15, boss.x - originX);
        for (let shot = -1; shot <= 0; shot++) spawnBullet(originX, 15, angle + shot * 0.18, 90);
      } else if (event.pattern === "lanes") {
        const safeLanes = getSafeLanes(boss.elapsed);
        const fromLeft = Math.floor(boss.elapsed / 1.55) % 2 === 0;
        for (let lane = 0; lane < 5; lane++) {
          if (safeLanes.includes(lane)) continue;
          const y = 55 + lane * 72;
          spawnBullet(fromLeft ? -8 : ARENA_WIDTH + 8, y, fromLeft ? 0 : Math.PI, 110, "diamond");
        }
      } else if (event.pattern === "red-nightmare") {
        const originX = ARENA_WIDTH / 2 + Math.sin(boss.elapsed * 1.7) * 145;
        const shots = 7;
        for (let shot = 0; shot < shots; shot++) {
          const angle = Math.PI / 2 + (shot - (shots - 1) / 2) * 0.24;
          spawnBullet(originX, 18, angle, 150, "diamond");
        }
        if (Math.floor(boss.elapsed / 1.1) % 2 === 0) {
          const side = boss.elapsed % 2 < 1 ? -5 : ARENA_WIDTH + 5;
          const angle = Math.atan2(boss.y - ARENA_HEIGHT * 0.55, boss.x - side);
          spawnBullet(side, ARENA_HEIGHT * 0.55, angle, 135);
        }
      } else if (event.pattern === "red-sleep") {
        const safeLane = [1, 3, 0, 4, 2][Math.floor(boss.elapsed / 0.92) % 5];
        const fromLeft = Math.floor(boss.elapsed / 0.92) % 2 === 0;
        for (let lane = 0; lane < 5; lane++) {
          if (lane === safeLane) continue;
          spawnBullet(fromLeft ? -8 : ARENA_WIDTH + 8, 48 + lane * 76, fromLeft ? 0 : Math.PI, 165, "diamond");
        }
        const originX = fromLeft ? ARENA_WIDTH - 20 : 20;
        const angle = Math.atan2(boss.y - 25, boss.x - originX);
        spawnBullet(originX, 25, angle, 115);
      } else if (event.pattern === "weekend-father") {
        const phase = Math.min(2, Math.floor(boss.elapsed / 15));
        const count = [3, 5, 8][phase];
        const speed = [126, 164, 205][phase];
        const originX = 70 + Math.random() * (ARENA_WIDTH - 140);
        const aim = Math.atan2(boss.y - 5, boss.x - originX);
        const spread = [0.2, 0.24, 0.28][phase];
        for (let shot = 0; shot < count; shot++) {
          spawnBullet(originX, -8, aim + (shot - (count - 1) / 2) * spread, speed, phase > 0 ? "diamond" : "orb");
        }
        if (phase > 0) {
          const side = Math.floor(boss.elapsed * 1.7) % 2 === 0 ? -8 : ARENA_WIDTH + 8;
          const sideAim = Math.atan2(boss.y - ARENA_HEIGHT * 0.55, boss.x - side);
          spawnBullet(side, ARENA_HEIGHT * 0.55, sideAim, speed * 0.82, "diamond");
        }
      } else if (event.pattern === "nightmare") {
        const intensity = Math.min(1, boss.elapsed / event.duration);
        const stage = Math.floor(boss.elapsed / 12);
        const count = 3 + Math.floor(intensity * 7);
        const speed = 105 + intensity * 112;
        const mode = Math.floor(boss.elapsed / 10) % 4;
        if (mode === 1) {
          const laneCount = 5 + Math.floor(intensity * 5);
          const gap = Math.floor((boss.elapsed * 0.7) % laneCount);
          for (let lane = 0; lane < laneCount; lane++) {
            if (lane === gap) continue;
            const fromLeft = Math.floor(boss.elapsed / 1.8) % 2 === 0;
            const y = 18 + (lane + 0.5) * (ARENA_HEIGHT - 36) / laneCount;
            spawnBullet(fromLeft ? -8 : ARENA_WIDTH + 8, y, fromLeft ? 0 : Math.PI, speed * 0.86, "diamond");
          }
        } else {
          const originX = 45 + ((boss.elapsed * 87) % (ARENA_WIDTH - 90));
          const aim = Math.atan2(boss.y - 10, boss.x - originX);
          const spread = 0.12 + intensity * 0.18;
          for (let shot = 0; shot < count; shot++) {
            spawnBullet(originX, -8, aim + (shot - (count - 1) / 2) * spread, speed, stage > 2 ? "diamond" : "orb");
          }
          if (mode === 3) {
            const side = boss.elapsed % 20 < 10 ? -8 : ARENA_WIDTH + 8;
            const sideAim = Math.atan2(boss.y - ARENA_HEIGHT * 0.48, boss.x - side);
            spawnBullet(side, ARENA_HEIGHT * 0.48, sideAim, speed * 0.92, "diamond");
          }
        }
      }
    }

    function bossAttackInterval() {
      if (boss.event.pattern === "weekend-father") return [1.1, 0.76, 0.48][Math.min(2, Math.floor(boss.elapsed / 15))];
      if (boss.event.pattern === "nightmare") return Math.max(0.3, 1.02 - boss.elapsed * 0.008);
      if (boss.event.pattern === "fan") return 1.5;
      if (boss.event.pattern === "lanes") return 1.55;
      if (boss.event.pattern === "red-nightmare") return 1.05;
      return 0.92;
    }

    function startBossMusic() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) {
        const phase = document.getElementById("boss-phase");
        if (phase) phase.textContent = "AUDIO UNAVAILABLE · VISUAL INTENSITY INCREASES";
        return;
      }
      boss.audio = new AudioContext();
      const audio = boss.audio;
      audio.resume().catch(() => {
        if (boss && boss.audio === audio) {
          audio.close();
          boss.audio = null;
          const phase = document.getElementById("boss-phase");
          if (phase) phase.textContent = "AUDIO BLOCKED · VISUAL INTENSITY INCREASES";
        }
      });
    }

    function tickBossMusic() {
      if (!boss || !boss.audio || boss.elapsed < boss.nextBeat) return;
      const intensity = Math.min(1, boss.elapsed / boss.event.duration);
      const tempo = 72 + Math.floor(intensity * 112);
      const audio = boss.audio;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      const notes = [110, 147, 165, 196, 220, 247, 262, 294];
      oscillator.type = boss.beatCount % 4 === 0 ? "sawtooth" : "square";
      oscillator.frequency.value = notes[boss.beatCount % notes.length] * (1 + intensity * 0.35);
      gain.gain.setValueAtTime(0.025 + intensity * 0.035, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.16);
      oscillator.connect(gain);
      gain.connect(audio.destination);
      oscillator.start();
      oscillator.stop(audio.currentTime + 0.17);
      boss.beatCount += 1;
      boss.nextBeat = boss.elapsed + 60 / tempo;
    }

    function updateBoss(timestamp) {
      if (!boss || !boss.active) return;
      const delta = Math.min((timestamp - boss.lastTime) / 1000, 0.04);
      boss.lastTime = timestamp;
      boss.elapsed += delta;
      boss.invulnerable = Math.max(0, boss.invulnerable - delta);
      const duration = boss.event.duration || 10;
      if (boss.elapsed >= duration) {
        completeEvent();
        return;
      }

      const horizontal = Number(heldKeys.has("right") || heldKeys.has("d") || heldKeys.has("arrowright")) -
        Number(heldKeys.has("left") || heldKeys.has("a") || heldKeys.has("arrowleft"));
      const vertical = Number(heldKeys.has("down") || heldKeys.has("s") || heldKeys.has("arrowdown")) -
        Number(heldKeys.has("up") || heldKeys.has("w") || heldKeys.has("arrowup"));
      if (boss.pointerDown && boss.pointerTarget) {
        boss.x += (boss.pointerTarget.x - boss.x) * Math.min(1, delta * 9);
        boss.y += (boss.pointerTarget.y - boss.y) * Math.min(1, delta * 9);
      } else {
        const length = Math.hypot(horizontal, vertical) || 1;
        const speed = boss.event.pattern.startsWith("red-") ? 255 : 235;
        boss.x += horizontal / length * speed * delta;
        boss.y += vertical / length * speed * delta;
      }
      boss.x = Math.max(PLAYER_RADIUS + 3, Math.min(ARENA_WIDTH - PLAYER_RADIUS - 3, boss.x));
      boss.y = Math.max(PLAYER_RADIUS + 3, Math.min(ARENA_HEIGHT - PLAYER_RADIUS - 3, boss.y));

      boss.spawnIn -= delta;
      if (boss.spawnIn <= 0) {
        spawnAttack();
        boss.spawnIn = bossAttackInterval();
      }
      for (let index = boss.bullets.length - 1; index >= 0; index--) {
        const bullet = boss.bullets[index];
        bullet.x += bullet.vx * delta;
        bullet.y += bullet.vy * delta;
        const hit = Math.hypot(bullet.x - boss.x, bullet.y - boss.y) < bullet.radius + PLAYER_RADIUS - 2;
        if (hit && boss.event.immortal) {
          nightmareHits += 1;
          boss.invulnerable = 0.25;
          const hitLabel = document.getElementById("nightmare-hit-count");
          if (hitLabel) hitLabel.textContent = `HITS · ${nightmareHits}`;
          boss.bullets.splice(index, 1);
          continue;
        }
        if (hit && boss.invulnerable === 0) {
          boss.lives -= 1;
          boss.invulnerable = 0.9;
          const livesLabel = document.getElementById("lives-label");
          if (livesLabel) {
            livesLabel.textContent = `${"❤ ".repeat(boss.lives)}${"♡ ".repeat(boss.maxLives - boss.lives)}`.trim();
            livesLabel.setAttribute("aria-label", `${boss.lives} hearts remaining`);
          }
          if (boss.lives === 0) {
            showGameOver(boss.event);
            return;
          }
          boss.bullets.splice(index, 1);
          continue;
        }
        if (bullet.x < -25 || bullet.x > ARENA_WIDTH + 25 || bullet.y < -25 || bullet.y > ARENA_HEIGHT + 25) boss.bullets.splice(index, 1);
      }
      drawArena();
      const timer = document.getElementById("timer-label");
      if (timer && boss.event.phases) {
        const phaseIndex = Math.min(boss.event.phases.length - 1, Math.floor(boss.elapsed / 15));
        const phaseRemaining = (phaseIndex + 1) * 15 - boss.elapsed;
        timer.textContent = `PHASE ${phaseIndex + 1} · ${Math.max(0, phaseRemaining).toFixed(1)}s · TOTAL ${Math.max(0, duration - boss.elapsed).toFixed(1)}s`;
        const phase = document.getElementById("boss-phase");
        if (phase) phase.textContent = `PHASE ${phaseIndex + 1} · ${boss.event.phases[phaseIndex]}`;
      } else if (timer) {
        timer.textContent = `SURVIVE · ${Math.max(0, duration - boss.elapsed).toFixed(1)}s`;
        if (boss.event.pattern === "nightmare") {
          const phase = document.getElementById("boss-phase");
          const intensity = Math.round(Math.min(1, boss.elapsed / duration) * 100);
          const tempo = 72 + Math.floor((boss.elapsed / duration) * 112);
          if (phase && !phase.textContent.startsWith("AUDIO")) phase.textContent = `NIGHTMARE INTENSITY · ${intensity}% · ${tempo} BPM`;
        }
      }
      tickBossMusic();
      animationFrame = requestAnimationFrame(updateBoss);
    }

    function drawArena() {
      if (!boss) return;
      const context = boss.context;
      context.clearRect(0, 0, ARENA_WIDTH, ARENA_HEIGHT);
      context.fillStyle = "#11162f";
      context.fillRect(0, 0, ARENA_WIDTH, ARENA_HEIGHT);
      context.strokeStyle = "#9caeff12";
      context.lineWidth = 1;
      for (let x = 20; x < ARENA_WIDTH; x += 40) {
        context.beginPath(); context.moveTo(x, 0); context.lineTo(x, ARENA_HEIGHT); context.stroke();
      }
      for (let y = 20; y < ARENA_HEIGHT; y += 40) {
        context.beginPath(); context.moveTo(0, y); context.lineTo(ARENA_WIDTH, y); context.stroke();
      }
      if (boss.event.pattern === "lanes") {
        const safeLanes = getSafeLanes(boss.elapsed);
        context.fillStyle = "#81edc70d";
        for (const lane of safeLanes) context.fillRect(0, 55 + lane * 72 - 24, ARENA_WIDTH, 48);
      } else if (boss.event.pattern === "red-sleep") {
        const safeLane = [1, 3, 0, 4, 2][Math.floor(boss.elapsed / 0.92) % 5];
        context.fillStyle = "#81edc716";
        context.fillRect(0, 48 + safeLane * 76 - 24, ARENA_WIDTH, 48);
      }
      for (const bullet of boss.bullets) {
        context.save();
        context.translate(bullet.x, bullet.y);
        context.rotate(bullet.shape === "diamond" ? Math.PI / 4 : 0);
        context.fillStyle = bullet.shape === "diamond" ? "#ff9cce" : "#ffd98b";
        context.shadowColor = context.fillStyle;
        context.shadowBlur = 12;
        context.beginPath();
        if (bullet.shape === "diamond") context.rect(-7, -7, 14, 14);
        else context.arc(0, 0, bullet.radius, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }
      drawHeart(context, boss.x, boss.y);
      if (!boss.active) {
        context.fillStyle = "#e9e9ff";
        context.textAlign = "center";
        context.font = "700 20px system-ui, sans-serif";
        context.fillText("READY WHEN YOU ARE", ARENA_WIDTH / 2, 45);
      }
    }

    function getSafeLanes(elapsed) {
      const gaps = [[1, 2], [3, 4], [0, 1], [2, 3], [4, 0]];
      return gaps[Math.floor(elapsed / 1.55) % gaps.length];
    }

    function drawHeart(context, x, y) {
      context.save();
      context.translate(x, y);
      context.scale(0.82, 0.82);
      context.beginPath();
      context.moveTo(0, 9);
      context.bezierCurveTo(-3, 5, -14, -2, -14, -9);
      context.bezierCurveTo(-14, -19, -1, -20, 0, -10);
      context.bezierCurveTo(1, -20, 14, -19, 14, -9);
      context.bezierCurveTo(14, -2, 3, 5, 0, 9);
      context.closePath();
      context.fillStyle = boss.invulnerable > 0 && Math.floor(boss.elapsed * 14) % 2 === 0 ? "#ffffff" : "#ff557f";
      context.shadowColor = "#ff557f";
      context.shadowBlur = 15;
      context.fill();
      context.restore();
    }

    function prepareShopping(event) {
      cleanupShopping();
      shoppingGame = { event, round: 0, aisle: 0, collected: new Set(), mistakes: 0, startedAt: performance.now() };
      renderShoppingStage();
      if (updateShoppingTimer()) shoppingInterval = window.setInterval(updateShoppingTimer, 100);
    }

    function updateShoppingTimer() {
      if (!shoppingGame) return false;
      const remaining = Math.max(0, shoppingGame.event.duration - (performance.now() - shoppingGame.startedAt) / 1000);
      const clock = document.getElementById("shopping-time");
      if (clock) clock.textContent = `${remaining.toFixed(1)}s`;
      if (remaining <= 0) {
        const event = shoppingGame.event;
        const messages = event.gameOver;
        showGameOver(event, messages[Math.floor(Math.random() * messages.length)]);
        return false;
      }
      return true;
    }

    function selectShoppingProduct(name) {
      if (!shoppingGame || !updateShoppingTimer()) return;
      const round = SHOPPING_ROUNDS[shoppingGame.round];
      const status = document.getElementById("shopping-status");
      if (!round.items.some((item) => item.name === name)) {
        shoppingGame.mistakes += 1;
        const mistakesLabel = document.getElementById("shopping-mistakes");
